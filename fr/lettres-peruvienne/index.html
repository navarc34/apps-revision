.small{font-size:14px;color:var(--muted)}.levels{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.levels button{border:1px solid #daddd9;background:white;border-radius:30px;padding:10px 17px;color:var(--ink);font-size:15px;font-weight:700}.levels button.active{background:var(--green);border-color:var(--green);color:white}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.backbtn{border:0;background:transparent;color:var(--green);font-weight:800;padding:8px 0}.bar{height:8px;background:#e9efec;border-radius:10px;overflow:hidden;margin:20px 0}.bar div{height:100%;background:var(--green);transition:width .2s}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tag{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;padding:5px 9px;border-radius:7px;color:#35685b;background:#eaf4ef}.question h2{font-size:23px;line-height:1.42;margin:0 0 22px}.choices{display:grid;gap:11px}.choices button{font:inherit;text-align:left;border:1px solid #dcdedc;background:#fdfdfc;padding:15px 17px;border-radius:12px;line-height:1.55;min-height:55px}.choices button.picked{background:#e7f3ee;border-color:#4e9b81}.choices button.good{background:#e4f8ea;border-color:#65ae7f}.choices button.wrong{background:#fff1ef;border-color:#d79c93}.choices button:disabled{color:inherit;opacity:1}.button{border:0;background:var(--green);color:white;padding:13px 20px;border-radius:30px;font-size:16px;font-weight:800;cursor:pointer}.button:disabled{opacity:.45;cursor:default}.action{margin-top:20px;display:flex;justify-content:flex-end}.feedback{padding:19px;margin-top:21px;border-radius:13px;background:#f3f8f5;border:1px solid #d8e9e0;font-size:16px;line-height:1.7}.error-explain{margin:10px 0 13px;padding:12px 14px;border-left:3px solid #c87f72;background:#fff6f3;border-radius:0 8px 8px 0}.core-explain{margin-top:8px}.feedback strong{display:block;margin-bottom:9px}.feedback .nuance{margin-top:14px;padding:12px;background:#fffdfa;border-left:3px solid #ac8e61}.ref{font-size:14px;color:#5e6469;margin-top:13px}.challenge{border:1px dashed #b5beae;border-radius:12px;padding:15px;background:#f8faf7;margin-bottom:20px}.challenge strong{display:block}.footer{border-top:1px solid var(--border);margin-top:35px;padding-top:20px;font-size:13px;color:var(--muted);display:flex;gap:15px;justify-content:space-between}.footer button{background:none;border:0;text-decoration:underline;color:var(--muted)}.result h2{font-size:26px}.result p{color:var(--muted)}.list{padding-left:20px}

<body><main class="shell"><a class="back" href="../">← Toutes les révisions de français</a><header class="heading"><div><div class="eyebrow">Français · 1re ST2S · EAF 2027</div><h1>Lettres d’une Péruvienne</h1><p>Françoise de Graffigny · Œuvre intégrale · V1.0</p></div><span class="mark">Z</span></header><div id="app"></div><footer class="footer"><span>Révision libre · Aucun résultat enregistré · Aucune saisie écrite ni enregistrement vocal</span></footer></main>
<script>
"use strict";
const DATA=[
["con","ess","CON","Qui est l’autrice des Lettres d’une Péruvienne ?",["Françoise de Graffigny","Madame de Lafayette","Olympe de Gouges","Madame de Sévigné"],0,"Françoise de Graffigny est une femme de lettres du XVIIIe siècle. Son roman interroge les mœurs, l’éducation et la condition féminine.","Repères éditoriaux et présentation de l’autrice.","","G-C01",""],
["con","ess","CON","Quelles dates retenir pour les deux premières éditions du roman ?",["1721 et 1750","1747 et 1752","1761 et 1789","1791 et 1793"],1,"Le roman paraît en 1747. L’édition augmentée de 1752 comporte 41 lettres au lieu de 38, dont trois nouvelles lettres.","Repère éditorial : éditions de 1747 et de 1752.","","G-C02","Les trois lettres ajoutées en 1752 sont XXIX, XXX et XXXIV ; la lettre XXVIII est remaniée."],
["con","ess","CON","À qui Zilia adresse-t-elle ses premières lettres ?",["À Déterville","À Céline","À Aza","À un religieux français"],2,"Aza est le prince inca aimé de Zilia. Ses premières lettres expriment son amour, son inquiétude et son espoir de le retrouver.","Lettres I–II — L’enlèvement et les pensées adressées à Aza.","","G-C03",""],
["con","ess","CON","Quel événement bouleverse la vie de Zilia au commencement du récit ?",["Son départ volontaire pour découvrir la France","La mort de Déterville pendant une guerre","L’interdiction d’apprendre à lire au Pérou","L’attaque du temple du Soleil par les Espagnols"],3,"L’attaque du temple du Soleil et l’enlèvement de Zilia interrompent son union prévue avec Aza. L’intrigue s’ouvre sur la violence coloniale.","Lettre I — L’attaque du temple du Soleil.","","G-C04",""],
["con","ess","CON","À quoi servent les quipos que Zilia utilise au début ?",["À conserver et transmettre ses pensées avec des nœuds","À identifier les prisonniers espagnols","À payer les dépenses pendant son voyage","À décorer ses vêtements de cérémonie"],0,"Les quipos permettent à Zilia d’inscrire ses pensées et ses sentiments dans des cordelettes nouées. Ils annoncent l’importance de l’écriture.","Lettres I, V et XVI — Les quipos, puis l’apprentissage de l’écriture.","","G-C05",""],
["con","ess","CON","Qui délivre Zilia des Espagnols et la conduit vers la France ?",["Le frère aîné d’Aza","Le chevalier Déterville","Le religieux rencontré au couvent","Le mari de Céline"],1,"Déterville commande le navire français qui s’empare du bateau espagnol où se trouve Zilia. Il devient son protecteur.","Lettres III–IV et XXI — Le changement de navire et l’identité de Déterville.","","G-C06",""],
["con","ess","CON","Quelle relation unit Céline et Déterville ?",["Ils sont fiancés","Ils sont cousins","Ils sont frère et sœur","Ils se rencontrent au couvent"],2,"Céline est la sœur de Déterville. Elle devient une amie essentielle pour Zilia.","Lettre XIII — Présentation de la famille de Déterville.","","G-C07",""],
["con","ess","CON","Pourquoi Zilia se retrouve-t-elle dans une maison religieuse en France ?",["Pour devenir religieuse selon son propre souhait","Pour préparer son mariage avec Déterville","Pour fuir volontairement Céline","Madame Déterville y fait enfermer Zilia et Céline"],3,"Madame Déterville impose ce séjour. Il manifeste l’autorité familiale exercée sur les jeunes femmes et sur le mariage de Céline.","Lettre XIX — L’enfermement de Zilia et de Céline.","","G-C08",""],
["con","ess","CON","Que permet progressivement l’apprentissage de la langue française ?",["À comprendre, écrire et remettre en question ses croyances","À Déterville de retrouver immédiatement Aza au Pérou","À Zilia d’oublier intégralement sa culture d’origine","À Céline d’obtenir aussitôt l’accord de sa mère pour se marier"],0,"En comprenant la langue française, Zilia accède à des connaissances qui bouleversent sa représentation du monde. La découverte est aussi intellectuelle.","Lettres XVI–XVIII — L’apprentissage de la langue et la révélation d’un nouvel univers.","","G-C09",""],
["con","ess","CON","Pourquoi Zilia reçoit-elle des objets précieux provenant du temple du Soleil ?",["Aza les lui envoie depuis l’Espagne","Déterville lui rend les trésors trouvés sur le navire","Le roi de France lui en fait cadeau","Céline les fabrique pour lui rappeler le Pérou"],1,"Déterville restitue à Zilia les objets trouvés sur le navire espagnol. Ils ont une valeur matérielle, mais aussi affective et culturelle.","Lettre XXVII — La restitution des trésors et le billet de Déterville.","","G-C10",""],
["con","ess","CON","Comment Zilia devient-elle propriétaire de sa maison de campagne ?",["Elle la reçoit directement du souverain français","Elle l’hérite de la mère de Déterville","Déterville l’achète en utilisant des trésors de Zilia","Elle la gagne par son travail de traductrice"],2,"Déterville utilise une partie des biens de Zilia pour acheter la maison et des terres à son nom. Cette propriété consolide son autonomie.","Lettre XXXV (1752) — La maison de campagne et le billet de Déterville.","","G-C11",""],
["con","ess","CON","À qui la dernière lettre du roman est-elle adressée ?",["À Aza","À Madame Déterville","À Céline","Au chevalier Déterville"],3,"Zilia s’adresse finalement à Déterville. Elle refuse de transformer leur amitié en mariage et défend une vie fondée sur la liberté, l’étude et l’amitié.","Lettre XLI (1752) — Dernière lettre à Déterville.","","G-C12",""],
["app","av","INT,REL","Quelle est la principale fonction de l’Avertissement au début du roman ?",["Révéler immédiatement le dénouement","Créer une illusion d’authenticité et critiquer les préjugés","Donner la biographie complète de Déterville","Affirmer que le regard européen sur le Pérou est toujours juste"],1,"L’Avertissement crée une fiction d’authenticité : les lettres seraient traduites et transmises. Il critique aussi le mépris européen envers les peuples d’Amérique.","Avertissement — Fiction éditoriale et dénonciation des préjugés.","On parle de stratégie romanesque d’authentification, non de preuves documentaires.","G-A01",""],
["app","av","INT,REL","Pourquoi le point de vue de Zilia rend-il les objets français étonnants ?",["Elle reconnaît immédiatement tous les objets","Elle veut démontrer l’infériorité des connaissances européennes","Elle refuse de décrire ses découvertes","Elle les interprète d’abord avec les catégories de sa culture"],3,"Navire, miroir et voiture sont décrits comme des merveilles énigmatiques. Le regard décentré transforme des objets ordinaires en découvertes.","Lettres III, X et XII — Navire, miroir et voiture.","Ses erreurs initiales font partie d’un apprentissage progressif, non d’une incapacité intellectuelle.","G-A02",""],
["app","av","INT,REL","Que révèle la scène du miroir dans la lettre X ?",["Un miroir qui bouleverse les repères de Zilia","Le rejet définitif de sa propre apparence","Le souvenir d’un miroir possédé au Pérou","La preuve que Déterville veut l’épouser"],0,"Zilia aperçoit son reflet sans comprendre d’abord le phénomène. La scène fait réfléchir à l’écart entre ce que l’on voit et ce que l’on comprend.","Lettre X — La découverte du miroir.","La scène peut aussi être étudiée comme une étape de la découverte de soi.","G-A03",""],
["app","av","INT,REL","Pourquoi les réactions des Français devant les vêtements de Zilia sont-elles significatives ?",["Elles montrent que l’habit inca est officiellement interdit","Elles prouvent que Zilia ignore tout des rangs sociaux","Elles révèlent des jugements fondés sur l’apparence","Elles témoignent d’une admiration toujours respectueuse"],2,"Zilia subit moqueries et curiosité intrusive. La différence entre l’apparence vestimentaire et la dignité de la personne nourrit la critique des mœurs.","Lettres XI et XIV — Les regards sur la tenue de Zilia.","","G-A04",""],
["app","av","INT,REL","Que permet de montrer le geste déplacé d’un homme envers Zilia dans la lettre XIV ?",["La parfaite égalité entre hommes et femmes","Le contraste entre politesse affichée et irrespect","L’impossibilité pour Zilia de défendre sa dignité","L’absence de toute réaction de Déterville"],1,"L’homme touche Zilia sans son accord et rit de sa réaction. La scène dénonce le décalage entre apparences polies et conduite irrespectueuse.","Lettre XIV — L’intrusion physique et la réaction de Zilia.","La question permet de distinguer la critique des comportements de celle d’une nation tout entière.","G-A05",""],
["app","av","INT,REL","Que symbolise le passage des quipos à l’écriture alphabétique ?",["L’abandon définitif de toute mémoire péruvienne","La disparition immédiate de l’amour pour Aza","L’acceptation aveugle des valeurs françaises","L’accès à un nouvel outil de pensée et de liberté"],3,"Apprendre le français écrit permet à Zilia de communiquer, d’organiser ses réflexions et d’acquérir une autonomie intellectuelle.","Lettres XVI–XVIII — Les quipos, les lettres et l’apprentissage.","L’enjeu est moins de remplacer une culture par une autre que d’élargir les moyens d’expression.","G-A06",""],
["app","av","INT,REL","Pourquoi la découverte du « nouvel univers » n’est-elle pas seulement heureuse dans la lettre XVIII ?",["Le savoir met en cause les certitudes de Zilia","Zilia découvre que la France est proche du Pérou","Elle cesse définitivement de vouloir apprendre","Elle comprend que tout le monde obéit à Aza"],0,"Zilia découvre l’étendue du monde et la distance entre France et Pérou. Le savoir la libère de certaines erreurs, mais la prive aussi de consolantes certitudes.","Lettre XVIII — La découverte du nouvel univers.","Cette ambivalence est centrale dans le parcours associé.","G-A07",""],
["app","av","INT,REL","Que critique Zilia dans la description de l’économie française, lettre XX ?",["L’existence de tout échange commercial","La construction de grandes villes","Les richesses ostentatoires et la pauvreté méprisée","Les différences de cultures agricoles"],2,"Elle oppose le devoir de protection du souverain inca aux inégalités françaises et s’indigne du rôle de l’argent dans l’accès aux ressources et à la considération.","Lettre XX — Critique des inégalités et de l’argent.","Le modèle inca présenté par Zilia est lui-même une représentation littéraire idéalisée.","G-A08",""],
["app","av","INT,REL","Pourquoi Zilia se méfie-t-elle du religieux qui cherche à la convertir ?",["Il refuse toute conversation avec elle","Il méprise ses croyances malgré son discours de vertu","Il ignore toutes les coutumes françaises","Il interdit matériellement l’accès aux livres"],1,"Zilia perçoit un décalage entre la tolérance et la charité proclamées, et le mépris que le religieux manifeste envers ses croyances.","Lettres XXI–XXII — Entretien avec le religieux et critique de l’intolérance.","","G-A09",""],
["app","av","INT,REL","Que dénonce la formule « Il faut paraître riche, c’est une mode » ?",["L’interdiction de posséder des biens","Le refus des Français de fréquenter les salons","La simplicité choisie par l’aristocratie","La mode qui impose des apparences ruineuses"],3,"Zilia dénonce l’apparence de richesse entretenue à grands frais, parfois aux dépens des nécessités de la vie. La formule fait entendre son ironie.","Lettre XXIX (ajout de 1752) — Le luxe et le paraître.","","G-A10",""],
["app","av","INT,REL","Quelle contradiction Zilia souligne-t-elle dans la condition féminine, lettre XXXIII ?",["Des hommages polis masquent le mépris et l’injustice","Les femmes disposent de tous les droits accordés aux hommes","Les femmes sont privées de toute vie mondaine","Hommes et femmes subissent les mêmes sanctions pour les mêmes comportements"],0,"Zilia oppose les égards de façade à l’inégalité réelle des rapports entre les sexes. La politesse n’empêche ni le mépris ni l’injustice.","Lettre XXXIII (1752) — Les femmes honorées et méprisées.","","G-A11",""],
["app","av","INT,REL","Pourquoi Zilia qualifie-t-elle l’éducation des filles de « chef-d’œuvre de l’inconséquence française » ?",["Les filles étudient trop les sciences","On attend des filles qu’elles gouvernent toutes les institutions","On demande la vertu sans donner une véritable éducation","L’éducation donne aux filles trop de pouvoir politique"],2,"L’éducation privilégie les apparences et des usages superficiels tout en prétendant former des femmes vertueuses : Zilia en dévoile la contradiction.","Lettre XXXIV (ajout de 1752) — L’éducation des filles.","L’affirmation de Zilia conteste une infériorité présentée comme naturelle.","G-A12",""],
["app","av","INT,REL","En quoi la maison de campagne constitue-t-elle une étape majeure de l’évolution de Zilia ?",["Elle lui permet de gouverner la société française","Elle peut y vivre, lire et penser selon ses choix","Elle oblige Aza à revenir au Pérou","Elle la force à épouser Déterville pour rester propriétaire"],1,"La maison donne à Zilia une indépendance matérielle et un lieu où elle organise une vie d’étude, de souvenir et d’amitié.","Lettre XXXV (1752) — La maison et son acquisition ; lettres XL–XLI — Le choix de vie.","","G-A13",""],
["app","av","INT,REL","Comment comprendre le refus final de Zilia d’épouser Déterville ?",["Elle juge Déterville indigne de toute affection","Elle veut rétablir immédiatement sa place de princesse inca","Elle veut entrer au couvent et ne plus voir personne","Elle préfère l’amitié libre à un mariage par gratitude"],3,"Zilia éprouve une affection et une gratitude véritables pour Déterville, mais refuse de promettre un amour qu’elle ne ressent pas.","Lettre XLI (1752) — Le choix final de Zilia.","La fin invite à discuter la liberté personnelle sans imposer un modèle unique du bonheur.","G-A14",""],
["dia","av","DIA,ILL","Examinateur : « Pourquoi peut-on dire que Zilia est une héroïne des Lumières ? »",["« Elle adopte aussitôt toutes les coutumes françaises. »","« Elle renonce finalement à toutes ses croyances. »","« Elle réfléchit et gagne progressivement sa liberté. »","« Elle devient une philosophe célèbre à Paris. »"],2,"La progression de Zilia associe savoir, réflexion personnelle, critique des préjugés et conquête de l’autonomie.","Lettres XVIII, XX, XXXIV et XLI — Savoir et liberté.","Une autre lecture de son parcours peut être défendue si elle repose sur des scènes précises.","G-D01",""],
["dia","av","DIA,ILL","Examinateur : « Le regard de Zilia est-il toujours objectif ? »",["« Non : ses croyances influencent parfois son regard. »","« Oui : une étrangère ne peut pas avoir de préjugés. »","« Oui : elle comprend immédiatement toutes les intentions des Français. »","« Non : elle refuse constamment d’observer la France. »"],0,"Zilia fait des erreurs sur les objets et les gestes avant de réviser ses hypothèses. Son regard est intéressant parce qu’il évolue.","Lettres IV–V, IX–X et XVIII — Les erreurs et leurs corrections.","On peut discuter le degré de lucidité de Zilia sans attribuer automatiquement ses jugements à l’autrice.","G-D02",""],
["dia","av","DIA,ILL","Examinateur : « Pourquoi comparer les lettres à des quipos ? »",["« Ils transmettent exclusivement des ordres politiques. »","« Elle abandonne les quipos dès son enlèvement. »","« Les deux écritures utilisent la même langue. »","« Ils gardent ses pensées et le lien avec Aza. »"],3,"Quipos et lettres prolongent le même besoin de mémoriser et de communiquer, mais le passage de l’un à l’autre accompagne une évolution intellectuelle.","Lettres I, V et XVI — Les quipos et l’apprentissage de l’écriture.","","G-D03",""],
["dia","av","DIA,ILL","Examinateur : « Critiquer la France, est-ce rejeter tous les Français ? »",["« Oui, Zilia refuse toute relation avec eux. »","« Non : elle critique les mœurs mais admire aussi des Français. »","« Oui, elle ne reconnaît aucune qualité à l’Europe. »","« Non, car toutes les sociétés sont présentées comme identiques. »"],1,"Zilia condamne certaines mœurs mais admire les inventions, les livres et les qualités de Déterville et de Céline.","Lettres XII, XX–XXII, XXIX et XLI — Un regard critique mais nuancé.","","G-D04",""],
["dia","av","DIA,ILL","Examinateur : « Pourquoi la lettre XXXIV éclaire-t-elle la critique de l’éducation des filles ? »",["« Elle affirme que les femmes sont naturellement moins capables. »","« Elle exige explicitement le droit de vote des femmes. »","« Elle dénonce une infériorité construite par l’éducation. »","« Elle veut supprimer toute responsabilité familiale. »"],2,"Zilia oppose les capacités possibles des femmes aux obstacles imposés par les pratiques éducatives et les rapports de pouvoir.","Lettre XXXIV (ajout de 1752) — Éducation et condition féminine.","","G-D05",""],
["dia","av","DIA,ILL","Examinateur : « Le dénouement n’est-il qu’un échec amoureux ? »",["« Son chagrin ouvre aussi sur une vie indépendante. »","« Oui, Zilia perd toute possibilité de bonheur. »","« Non, puisqu’elle épouse finalement Déterville. »","« Oui, parce que le roman se termine par sa mort. »"],0,"Le chagrin amoureux demeure, mais Zilia redéfinit le bonheur autour de l’étude, de la nature, de la liberté et de l’amitié.","Lettres XXXVIII–XLI (1752) — De la rupture au choix final.","Les réactions au dénouement peuvent diverger ; c’est leur justification qui compte.","G-D06",""],
["dia","av","DIA,ILL","Examinateur : « En quoi Zilia peut-elle rappeler Rica dans la lettre 30 des Lettres persanes ? »",["« Ils appartiennent à la même famille. »","« Ils décrivent exactement la même scène. »","« Ils portent les mêmes vêtements. »","« Ils révèlent les préjugés par un regard étranger. »"],3,"Zilia et Rica rendent visibles des automatismes de jugement. Le rapprochement repose sur le procédé du regard étranger, pas sur une identité de situations.","Graffigny, lettres XI et XIV ; Montesquieu, Lettres persanes, lettre 30.","","G-D07",""],
["dia","av","DIA,ILL","Examinateur : « La fin signifie-t-elle que Zilia n’a plus besoin des autres ? »",["« Oui, elle choisit un isolement absolu. »","« Non : elle choisit l’autonomie et l’amitié. »","« Oui, elle rompt avec Déterville et Céline. »","« Non, elle accepte de dépendre entièrement de Déterville. »"],1,"Zilia rejette la dépendance amoureuse mais souhaite préserver les liens qu’elle choisit.","Lettres XL–XLI (1752) — La liberté et l’amitié.","","G-D08",""],
["choix","av","PRE,JUS","Quelle présentation situe correctement l’œuvre au début de l’entretien ?",["« Un roman autobiographique publié au XIXe siècle. »","« Un récit de voyage documentaire écrit par une princesse inca. »","« Un roman épistolaire de Graffigny, paru en 1747 et repris en 1752. »","« Une pièce de théâtre des Lumières sur le Pérou. »"],2,"Une présentation brève associe autrice, genre, dates et personnage principal, puis ouvre sur ton intérêt personnel.","Repères éditoriaux ; ensemble de l’œuvre.","Ce n’est pas une formule obligatoire à réciter.","G-P01",""],
["choix","av","PRE,JUS","Tu dis : « J’ai aimé la façon dont Zilia découvre la France. » Comment approfondir cette impression ?",["« Expliquer mon intérêt à partir d’une scène précise. »","« Dire que tous les objets français sont supérieurs à ceux du Pérou. »","« Résumer seulement son parcours géographique. »","« Répéter que le livre est intéressant sans exemple. »"],0,"Choisis une scène : miroir, salon, langue ou livres, et explique ce qu’elle a produit sur ton regard de lecteur.","Lettres X–XI, XVI–XVIII ou XX — Passages au choix.","Une autre scène, plus personnelle, peut constituer un excellent choix.","G-P02",""],

["choix","av","PRE,JUS","Tu trouves Zilia parfois trop sévère envers les Français. Comment défendre cet avis ?",["« Affirmer que toutes ses critiques sont fausses. »","« Appuyer ma réserve sur un passage et la nuancer. »","« Écarter les lettres qui nuanceraient mon avis. »","« Dire que le professeur doit être d’accord. »"],1,"Une réserve critique peut être pertinente : identifie une généralisation discutable et ce que le regard de Zilia éclaire malgré tout.","Lettres XI, XX, XXIX et XXXII — Jugements et satire.","Le désaccord avec le personnage est recevable s’il s’appuie sur le texte.","G-P04",""],

const CONTEXTE={};
const FEEDBACK_ERREUR={"G-C01":{"1":"Madame de Lafayette est notamment l’autrice de La Princesse de Clèves, roman du XVIIe siècle.","2":"Olympe de Gouges écrit notamment la Déclaration des droits de la femme et de la citoyenne en 1791.","3":"Madame de Sévigné est connue pour sa correspondance du XVIIe siècle."},"G-C02":{"0":"1721 est la date de publication des Lettres persanes de Montesquieu.","2":"1761 correspond à La Nouvelle Héloïse de Rousseau ; 1789 ouvre la Révolution française.","3":"Ces dates appartiennent à la période révolutionnaire, postérieure au roman."},"G-C03":{"0":"Déterville deviendra son protecteur français et le destinataire de la dernière lettre.","1":"Céline est l’amie française de Zilia, mais non la destinataire initiale.","3":"Zilia rencontre un religieux en France ; il ne reçoit pas ses premières lettres."},"G-C04":{"0":"Le voyage est subi : Zilia est enlevée, elle ne part pas par curiosité.","1":"Déterville intervient plus tard et ne meurt pas pendant le récit.","2":"Zilia reçoit une instruction au Pérou, avant d’apprendre le français."},"G-C05":{"1":"Les quipos ne servent pas à identifier les prisonniers : Zilia y inscrit ses pensées.","2":"Ils ne constituent pas une monnaie de voyage.","3":"Leur fonction ici est mémorielle et communicative, non simplement décorative."},"G-C06":{"0":"Ce personnage n’intervient pas dans le sauvetage de Zilia.","2":"Le religieux apparaît une fois Zilia installée en France.","3":"Le futur mari de Céline n’est pas responsable de la délivrance de Zilia."},"G-C07":{"0":"Céline aime un autre jeune homme, dont sa mère contrarie le mariage.","1":"Céline et Déterville appartiennent à la même fratrie, non à une parenté éloignée.","3":"Leur lien familial précède le séjour de Zilia dans la maison religieuse."},"G-C08":{"0":"Zilia n’entre pas volontairement dans un ordre religieux.","1":"Elle reste attachée à Aza et ne prépare pas un mariage avec Déterville.","2":"Céline est enfermée avec elle ; Zilia ne cherche pas à la fuir."},"G-C09":{"1":"L’apprentissage n’entraîne aucun retour immédiat d’Aza.","2":"Zilia conserve un attachement profond au Pérou et à ses objets.","3":"Le désaccord de la mère de Céline ne dépend pas de la maîtrise du français par Zilia."},"G-C10":{"0":"Zilia croit d’abord qu’Aza en est l’expéditeur, mais le billet indique Déterville.","2":"Ces objets ne sont pas offerts par le roi de France.","3":"Céline accompagne leur restitution ; elle ne les a pas fabriqués."},"G-C11":{"0":"La propriété ne vient pas d’une donation du souverain français.","1":"Elle ne provient pas d’un héritage de Madame Déterville.","3":"Zilia ne gagne pas la maison grâce à un salaire de traduction."},"G-C12":{"0":"Aza reçoit les premières lettres mais n’est plus le destinataire final.","1":"Madame Déterville représente surtout une autorité familiale contraignante.","2":"Céline demeure une amie précieuse, sans recevoir la lettre finale."},"G-A01":{"0":"L’Avertissement ne raconte pas la fin de l’intrigue.","2":"Déterville intervient dans la transmission supposée des lettres, sans faire l’objet d’une biographie.","3":"Le texte combat précisément les préjugés européens sur les peuples non européens."},"G-A02":{"0":"Elle ignore d’abord l’usage de plusieurs objets, ce qui crée la surprise du lecteur.","1":"Zilia admire souvent les inventions françaises tout en critiquant certaines mœurs.","2":"Ses lettres multiplient justement les observations et les hypothèses."},"G-A03":{"1":"Elle ne rejette pas son apparence : elle s’étonne de la réflexion.","2":"Elle ne reconnaît pas un objet déjà familier.","3":"Le miroir ne constitue pas une demande en mariage."},"G-A04":{"0":"Le roman ne mentionne aucune interdiction légale des vêtements incas.","1":"Zilia connaît des distinctions de rang ; la question porte sur le regard des autres.","3":"Les réactions sont parfois moqueuses ou irrespectueuses, pas toujours admiratives."},"G-A05":{"0":"L’homme franchit une limite que Zilia refuse : ce n’est pas une relation d’égalité.","2":"Zilia le repousse et manifeste clairement son indignation.","3":"Déterville intervient pour mettre fin à la scène."},"G-A06":{"0":"Zilia conserve les souvenirs et les objets de son pays.","1":"Elle reste attachée à Aza longtemps après avoir appris le français.","2":"La langue française lui permet aussi de critiquer la France."},"G-A07":{"1":"Elle découvre au contraire l’éloignement considérable des deux pays.","2":"La douleur n’entraîne pas un renoncement durable à la connaissance.","3":"Elle découvre précisément que le monde ne se limite pas au royaume d’Aza."},"G-A08":{"0":"La critique vise l’injustice sociale, non l’idée même d’échanger.","1":"Les villes ne sont pas la principale cible de cette lettre.","3":"Zilia critique la répartition des ressources et les privilèges, non les techniques agricoles."},"G-A09":{"0":"Le religieux échange avec Zilia et l’informe sur plusieurs points.","2":"Il connaît sa religion et les usages de sa société.","3":"Le désaccord porte surtout sur les croyances et les jugements, non sur la confiscation de livres."},"G-A10":{"0":"Les nobles cherchent justement à afficher leur richesse, même lorsqu’elle est fictive.","1":"Les mondanités occupent une place centrale dans la société décrite.","2":"Le texte critique les dépenses ostentatoires au nom de la modération."},"G-A11":{"1":"La lettre met en évidence une forte dissymétrie des droits et des sanctions.","2":"Les femmes participent aux mondanités sans disposer pour autant d’une liberté égale.","3":"Le texte insiste sur l’impunité masculine et les contraintes imposées aux femmes."},"G-A12":{"0":"Zilia critique plutôt le défaut d’instruction véritable.","1":"Le texte ne demande pas que les filles gouvernent toutes les institutions.","3":"La critique porte sur la dépendance et le manque d’éducation, non sur un excès de pouvoir féminin."},"G-A13":{"0":"Cette propriété n’est pas un pouvoir politique.","2":"La maison ne modifie pas la décision d’Aza.","3":"Zilia peut habiter cette maison sans se marier avec Déterville."},"G-A14":{"0":"Zilia estime Déterville : le refus du mariage n’est pas un rejet de la personne.","1":"Le retour à son ancien rang n’est plus son projet.","2":"Elle choisit une solitude ouverte à l’amitié, non une réclusion religieuse."},"G-D01":{"0":"Elle critique souvent les coutumes françaises au lieu de les accepter sans examen.","1":"Son évolution n’exige pas de renoncer à toutes ses convictions.","3":"Elle réfléchit par elle-même, sans devenir une célébrité philosophique parisienne."},"G-D02":{"1":"Un regard extérieur peut aussi être marqué par des croyances et des habitudes.","2":"Elle comprend mal le miroir ou les gestes de Déterville avant d’en saisir le sens.","3":"Elle observe constamment son environnement et cherche à le comprendre."},"G-D03":{"0":"Dans ce roman, leur fonction est surtout affective et personnelle.","1":"Zilia utilise les quipos après l’enlèvement.","2":"Les systèmes d’inscription diffèrent, malgré certaines fonctions communes."},"G-D04":{"0":"Elle noue des relations d’amitié profondes avec plusieurs Français.","2":"La critique laisse place aussi à l’admiration et à la découverte.","3":"Comparer les sociétés ne signifie pas supprimer leurs différences."},"G-D05":{"0":"La lettre conteste l’idée d’une infériorité naturelle.","1":"Elle critique l’éducation et le mariage sans formuler une revendication électorale moderne.","3":"Elle critique l’inégalité des droits et des devoirs, pas toute vie familiale."},"G-D06":{"1":"Zilia trouve d’autres ressources pour vivre et être heureuse.","2":"Elle refuse précisément le mariage avec Déterville.","3":"Le roman s’achève sur un projet de vie, non sur sa mort."},"G-D07":{"0":"Rica est un personnage persan de Montesquieu, sans lien familial avec Zilia.","1":"Les scènes et les contextes diffèrent ; on compare leurs mécanismes.","2":"Leurs vêtements et leurs réactions sociales ne sont pas identiques."},"G-D08":{"0":"Sa maison reste ouverte aux relations choisies.","2":"Elle propose au contraire de poursuivre l’amitié.","3":"Elle refuse que la gratitude crée une nouvelle obligation affective."},"G-P01":{"0":"Il ne s’agit ni d’une autobiographie ni d’un roman du XIXe siècle.","1":"Zilia est une narratrice de fiction, pas l’autrice d’un reportage.","3":"Le roman prend la forme de lettres, pas d’une pièce de théâtre."},"G-P02":{"1":"Le roman ne hiérarchise pas simplement deux civilisations.","2":"Le résumé du voyage n’explique pas ton intérêt personnel.","3":"Un jugement général sans exemple est difficile à développer à l’oral."},"G-P03":{"0":"Le dénouement reste douloureux pour plusieurs personnages.","1":"La passion pour Aza domine une grande partie du roman.","2":"Résumer la fin ne dit pas pourquoi elle t’a marqué."},"G-P04":{"0":"Une généralisation discutable n’annule pas toute la critique.","2":"Une argumentation sérieuse confronte aussi les passages qui la nuancent.","3":"Le jugement du professeur ne remplace pas une justification personnelle."},"G-P05":{"0":"Apprécier une œuvre ne signifie pas admirer tous ses personnages.","1":"Comparer avec une autre œuvre n’est pas une obligation.","3":"Il n’existe pas une seule réaction personnelle attendue."},"G-P06":{"1":"Le roman fait réfléchir sans résoudre tous les problèmes sociaux.","2":"Une conclusion personnelle peut être reformulée et discutée.","3":"Des interprétations différentes peuvent être défendues avec des arguments."}};
const MODULES={con:["🧭","Connaître","Personnages, intrigue, structure, contexte."],app:["🔎","S'approprier","Passages, interprétations et nuances."],dia:["💬","Dialoguer","Questions d'examinateur et réponses argumentées."],choix:["✦","Mon choix d'œuvre","Trouver tes raisons personnelles de présenter cette œuvre."]};
const app=document.getElementById("app");
let module=null,pos=0,selected=[],validated=false,optionOrders={};
function shuffledOrder(n){const a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orderForQuestion(index,n){return optionOrders[index]||(optionOrders[index]=shuffledOrder(n))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function home(){module=null;window.scrollTo(0,0);render()}
function start(m){module=m;pos=0;selected=[];validated=false;optionOrders={};window.scrollTo(0,0);render()}
function items(){return DATA.map((d,i)=>({d,i})).filter(x=>x.d[0]===module)}
function pick(i){if(validated)return;selected=[i];render()}
function correct(){return selected[0]===items()[pos].d[5]}
function validate(){if(!selected.length||validated)return;validated=true;render()}
function next(){if(pos+1>=items().length){pos=items().length;render();return}pos++;selected=[];validated=false;render()}
function render(){
if(!module){
app.innerHTML='<section class="hero"><div class="eyebrow">Œuvre intégrale · Préparation à l’entretien de l&#39;oral du bac français</div><h2>Connaître, interpréter, dialoguer</h2><p>Les activités t’aideront à mieux connaître le roman, à choisir des exemples précis et à préparer une lecture personnelle.</p><div class="principle">Une interprétation n’est pas une réponse à apprendre. Plusieurs lectures peuvent être défendues si elles respectent le texte et sont argumentées.</div></section><section class="modules">'+Object.entries(MODULES).map(([k,m])=>'<button class="module" data-module="'+k+'"><span class="sym">'+m[0]+'</span><strong>'+esc(m[1])+'</strong><span>'+esc(m[2])+'</span></button>').join('')+'</section>';
app.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>start(b.dataset.module));return}
const its=items();if(pos>=its.length){app.innerHTML='<section class="result"><div class="eyebrow">Activité terminée</div><h2>'+esc(MODULES[module][1])+'</h2><p>Tu as terminé les questions de cette activité. Tu peux revoir les passages cités dans les corrections, puis reprendre les questions librement.</p><button class="button" id="return">Retour aux activités</button></section>';document.getElementById("return").onclick=home;return}
const d=its[pos].d, ok=validated?correct():null, interpr=module!=="con", contexte=d[10], displayOrder=orderForQuestion(d[9],d[4].length);const ref=d[7], erreur=validated&&!ok?FEEDBACK_ERREUR[d[9]]?.[selected[0]]:null, nuance=d[8]||"Cette réponse est une piste possible mais pas une formulation obligatoire. D'autres lectures argumentées peuvent être recevables.";
app.innerHTML='<div class="top"><button class="backbtn" id="return">← Activités</button><span class="small">'+esc(MODULES[module][1])+' · '+(pos+1)+' / '+its.length+'</span></div><section class="question">'+(module==="dia"?'<div class="challenge"><strong>Mode défi</strong>Avant de regarder les propositions, imagine ce que tu pourrais répondre. Les choix servent ensuite à comparer des stratégies d’argumentation.</div>':'')+'<h2>'+esc(d[3])+'</h2><div class="choices">'+displayOrder.map(i=>'<button data-choice="'+i+'" class="'+(validated&&i===d[5]?'good':validated&&selected[0]===i?'wrong':selected[0]===i?'picked':'')+'" '+(validated?'disabled':'')+'>'+esc(d[4][i])+'</button>').join('')+'</div>'+(validated?'<div class="feedback"><strong>'+(ok?'✓ Bonne réponse':'À reprendre')+'</strong>'+(erreur?'<div class="error-explain">'+esc(erreur)+'</div>':'')+'<div class="core-explain">'+esc(d[6])+'</div>'+(interpr?'<div class="nuance">'+esc(nuance)+'</div>':'')+(contexte?'<div class="nuance"><strong>Repère de contexte</strong><div>'+esc(contexte)+'</div></div>':'')+'<div class="ref">Repère textuel : '+esc(ref)+'</div></div>':'')+'<div class="action"><button class="button" id="action" '+(!validated&&!selected.length?'disabled':'')+'>'+(validated?(pos+1===its.length?'Terminer l’activité':'Question suivante →'):'Valider ma réponse')+'</button></div></section>';
document.getElementById("return").onclick=home;
app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>pick(Number(b.dataset.choice)));
document.getElementById("action").onclick=validated?next:validate;
}
render();
</script></body></html>
