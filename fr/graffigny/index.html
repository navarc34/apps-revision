<title>Lettres d'une Péruvienne · Révision V2</title>

<body>
<div id="root"></div>
<div id="fallback" style="font:16px system-ui;margin:60px auto;max-width:550px;padding:20px">Chargement de l'application… Si ce message persiste, vérifie que JavaScript est activé.</div>
<script>
/* ============ MESURE D'AUDIENCE (Google Apps Script) ============
   Les événements (ouverture, module, score) partent vers la feuille
   de suivi associée à cette app. */
const TRACK_URL = "https://script.google.com/macros/s/AKfycbyM5Eaz4lLDmbVEWX0GcjTTL1NtMWAm9NEw7c-Ifyg6MsdFco0TQ0Duuehc2-dZNSGErA/exec";

/* Identifiant visiteur pseudonymisé : généré une fois par navigateur.
   Aucune donnée nominative n'est collectée ; l'identifiant sert uniquement
   à distinguer les sessions dans la feuille de suivi. */
function getUid() {
  try {
    let uid = window.localStorage.getItem("graffigny-uid");
    if (!uid) {
      uid = "u-" + Math.random().toString(36).slice(2, 10) + "-" + Date.now().toString(36);
      window.localStorage.setItem("graffigny-uid", uid);
    }
    return uid;
  } catch (err) { return "anonyme"; }
}

/* Type d'appareil : lu depuis le "user agent" du navigateur (type · OS · navigateur). */
function getDevice() {
  const ua = navigator.userAgent || "";
  const isTablet = /iPad|Tablet|Nexus (?:7|9|10)/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua));
  const isPhone = /iPhone|iPod|Windows Phone/i.test(ua) || (/Android/i.test(ua) && /Mobile/i.test(ua));
  const os = /iPhone|iPod|iPad/i.test(ua) ? "iOS" : /Android/i.test(ua) ? "Android" : /Windows/i.test(ua) ? "Windows" : /Mac/i.test(ua) ? "macOS" : /Linux/i.test(ua) ? "Linux" : "OS ?";
  const browser = /Edg\//i.test(ua) ? "Edge" : /OPR|Opera/i.test(ua) ? "Opera" : /Firefox/i.test(ua) ? "Firefox" : /Chrome/i.test(ua) ? "Chrome" : /Safari/i.test(ua) ? "Safari" : "navigateur ?";
  const type = isTablet ? "Tablette" : isPhone ? "Mobile" : "Ordinateur";
  return type + " · " + os + " · " + browser;
}

/* Nom de l'app, déduit de son URL : https://pseudo.github.io/test-app/ → "test-app",
   https://pseudo.github.io/latin/révision-mythologie/ → "latin_revision-mythologie".
   Les accents et caractères spéciaux sont neutralisés (noms d'onglet Sheets sûrs). */
function getAppName() {
  try {
    let p = window.location.pathname.replace(/^\/+/, "").replace(/\/+$/, "");
    if (!p) return "defaut";
    p = p.split("/").join("_").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    p = p.replace(/[^A-Za-z0-9_\-]/g, "-").replace(/\-{2,}/g, "-");
    return p.slice(0, 90) || "defaut";
  } catch (err) { return "defaut"; }
}

function track(event, module, score) {
  if (!TRACK_URL || TRACK_URL.indexOf("COLLE_ICI") === 0) return;
  try {
    let u = TRACK_URL + "?e=" + encodeURIComponent(event) + "&u=" + encodeURIComponent(getUid())
          + "&d=" + encodeURIComponent(getDevice())
          + "&a=" + encodeURIComponent(getAppName());
    if (module) u += "&m=" + encodeURIComponent(module);
    if (score !== undefined && score !== null) u += "&s=" + encodeURIComponent(score);
    if (document.referrer) u += "&r=" + encodeURIComponent(document.referrer);
    fetch(u, { mode: "no-cors" });
  } catch (err) {}
}
</script>
