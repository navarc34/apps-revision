body{background:var(--cream);color:var(--ink);font-size:17px;line-height:1.6}.shell{max-width:820px;margin:0 auto;padding:28px 20px 70px}.back{font-size:15px;text-decoration:none;color:var(--green);font-weight:700}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:18px 0 28px}.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#747978;font-weight:800}.heading h1{font-size:clamp(34px,6vw,47px);margin:0;letter-spacing:-.04em;line-height:1.1}.heading p{margin:5px 0;color:var(--muted)}.mark{display:grid;place-items:center;width:70px;height:70px;border:1px solid #d8dfdb;border-radius:50%;font:italic 35px Georgia,serif;color:var(--green)}
.hero,.panel,.question,.result{background:white;border:1px solid var(--border);border-radius:20px;padding:28px;margin-bottom:20px;box-shadow:0 9px 35px -30px #6d6d6d}.hero h2{font-size:27px;margin:5px 0 12px;line-height:1.3}.hero p{margin:0 0 14px;color:var(--muted)}.principle{border-left:3px solid var(--green);padding:12px 16px;background:#f1f7f4;border-radius:0 10px 10px 0;font-size:15px;color:#36544b}.modules{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.module{border:1px solid var(--border);border-radius:17px;text-align:left;background:white;padding:20px;min-height:170px;cursor:pointer}.module:hover{border-color:var(--green);background:#fbfdfc}.module .sym{font-size:24px}.module strong{display:block;font-size:21px;margin:9px 0 4px}.module span:last-child{display:block;color:var(--muted);font-size:15px;line-height:1.55}
.small{font-size:14px;color:var(--muted)}.levels{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.levels button{border:1px solid #daddd9;background:white;border-radius:30px;padding:10px 17px;color:var(--ink);font-size:15px;font-weight:700}.levels button.active{background:var(--green);border-color:var(--green);color:white}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.backbtn{border:0;background:transparent;color:var(--green);font-weight:800;padding:8px 0}.bar{height:8px;background:#e9efec;border-radius:10px;overflow:hidden;margin:20px 0}.bar div{height:100%;background:var(--green);transition:width .2s}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tag{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;padding:5px 9px;border-radius:7px;color:#35685b;background:#eaf4ef}.question h2{font-size:23px;line-height:1.42;margin:0 0 22px}.choices{display:grid;gap:11px}.choices button{font:inherit;text-align:left;border:1px solid #dcdedc;background:#fdfdfc;padding:15px 17px;border-radius:12px;line-height:1.55;min-height:55px}.choices button.picked{background:#e7f3ee;border-color:#4e9b81}.choices button.good{background:#e4f8ea;border-color:#65ae7f}.choices button.wrong{background:#fff1ef;border-color:#d79c93}.choices button:disabled{color:inherit;opacity:1}.button{border:0;background:var(--green);color:white;padding:13px 20px;border-radius:30px;font-size:16px;font-weight:800;cursor:pointer}.button:disabled{opacity:.45;cursor:default}.action{margin-top:20px;display:flex;justify-content:flex-end}.feedback{padding:19px;margin-top:21px;border-radius:13px;background:#f3f8f5;border:1px solid #d8e9e0;font-size:16px;line-height:1.7}.feedback strong{display:block;margin-bottom:9px}.feedback .nuance{margin-top:14px;padding:12px;background:#fffdfa;border-left:3px solid #ac8e61}.ref{font-size:14px;color:#5e6469;margin-top:13px}.challenge{border:1px dashed #b5beae;border-radius:12px;padding:15px;background:#f8faf7;margin-bottom:20px}.challenge strong{display:block}.footer{border-top:1px solid var(--border);margin-top:35px;padding-top:20px;font-size:13px;color:var(--muted);display:flex;gap:15px;justify-content:space-between}.footer button{background:none;border:0;text-decoration:underline;color:var(--muted)}.result h2{font-size:26px}.result p{color:var(--muted)}.list{padding-left:20px}
@media(max-width:600px){.shell{padding:19px 14px 52px}.modules{grid-template-columns:1fr}.hero,.panel,.question,.result{padding:20px}.question h2{font-size:21px}.heading{margin-top:14px}.mark{width:52px;height:52px;font-size:27px}.top{align-items:flex-start}.footer{flex-direction:column}}

<body><main class="shell"><a class="back" href="../">← Toutes les révisions de français</a><header class="heading"><div><div class="eyebrow">Français · 1re ST2S · EAF 2027</div><h1>Americanah</h1><p>Chimamanda Ngozi Adichie · Lecture cursive · V1.0</p></div><span class="mark">A</span></header><div id="app"></div><footer class="footer"><span>Révision libre · Aucun résultat enregistré · Aucune saisie écrite ni enregistrement vocal</span></footer></main>
<script>
"use strict";
const DATA=[
["con","ess","CON","Qui a écrit Americanah ?",["Chimamanda Ngozi Adichie","Toni Morrison","Chinua Achebe","Françoise de Graffigny"],0,"La romancière nigériane Chimamanda Ngozi Adichie a publié Americanah en anglais.","Page de titre et présentation de l'édition.","","AM-C01",""],
["con","ess","CON","Quand Americanah a-t-il été publié pour la première fois ?",["1995","2006","2013","2020"],2,"Le roman a été publié en 2013 ; il interroge les migrations et les appartenances dans le monde contemporain.","Repères éditoriaux de l'œuvre.","","AM-C02",""],
["con","ess","CON","Quel personnage féminin occupe le premier plan du récit ?",["Kosi","Ifemelu","Ginika","Ranyinudo"],1,"Ifemelu grandit au Nigeria, étudie aux États-Unis puis revient vivre à Lagos.","Première partie ; retour au Nigeria.","","AM-C03",""],
["con","ess","CON","Qui est Obinze pour Ifemelu ?",["Un partenaire rencontré plus tard lors du séjour d'Ifemelu aux États-Unis","Son cousin éloigné","Un journaliste de Lagos","L'amour de jeunesse d'Ifemelu au Nigeria"],3,"Ifemelu et Obinze se rencontrent jeunes au Nigeria. Leurs migrations les séparent et ils se retrouvent après leur retour.","Deuxième partie ; chapitre 55.","","AM-C04",""],
["con","ess","CON","Où Ifemelu part-elle étudier ?",["Aux États-Unis","En France","Au Royaume-Uni","En Afrique du Sud"],0,"Elle rejoint les États-Unis, où elle découvre de nouveaux codes sociaux et une façon particulière de la catégoriser racialement.","Deuxième partie, départ vers les États-Unis.","","AM-C05",""],
["con","ess","CON","Que vit Obinze lorsqu'il cherche à s'établir à l'étranger ?",["Il poursuit des études de longue durée au Canada grâce à une bourse universitaire","Il obtient immédiatement la citoyenneté américaine","Il connaît une vie précaire au Royaume-Uni, puis une expulsion","Il ouvre un commerce à Paris"],2,"Obinze travaille et vit au Royaume-Uni dans une situation administrative difficile. Il est finalement renvoyé au Nigeria.","Partie du récit consacrée à Obinze au Royaume-Uni.","Son parcours n'est pas représentatif de tous les migrants.","AM-C06","Les lois relatives au séjour et au travail influencent les possibilités offertes aux personnes migrantes."],
["con","ess","CON","Dans quel cadre s'ouvre le roman ?",["Une cérémonie organisée au Nigeria pour célébrer le retour d'une jeune migrante","Princeton puis un salon de coiffure","Une gare de Londres","Un mariage au Nigeria"],1,"L'ouverture suit Ifemelu à Princeton, puis son trajet pour faire tresser ses cheveux avant son retour au Nigeria.","Première partie, chapitre 1.","","AM-C07",""],
["con","ess","CON","Que vient faire Ifemelu au salon de coiffure ?",["Signer un contrat de travail","Rencontrer Blaine","Revoir Obinze","Faire tresser ses cheveux"],3,"Le salon devient un lieu de conversations sur l'origine, les cheveux et l'immigration, dans un moment de transition.","Première partie, chapitre 1.","","AM-C08",""],
["con","ess","CON","Que publie Ifemelu sur son blog américain ?",["Ses observations des rapports raciaux américains","Les études médicales de Tante Uju et ses difficultés à travailler en milieu hospitalier","Des lettres destinées uniquement à Obinze","Des guides touristiques du Nigeria"],0,"À travers son blog, Ifemelu propose des réflexions souvent ironiques sur la race et les usages sociaux américains.","Billets du blog Raceteenth insérés dans le récit.","","AM-C09",""],
["con","ess","CON","Qui est Dike ?",["Le frère d'Obinze","Un ancien fiancé de Ginika","Le fils de Tante Uju","Le responsable du salon de coiffure"],2,"Dike grandit aux États-Unis. Son histoire met en lumière la question de l'appartenance et les difficultés d'un jeune Noir américain.","Épisodes concernant Tante Uju et Dike.","","AM-C10",""],
["con","ess","CON","Que suggère le mot Americanah au Nigeria ?",["Un parti politique","Une personne revenue d'Amérique avec des habitudes perçues comme américaines","Une publication fondée par les anciens étudiants nigérians installés aux États-Unis","Un quartier privilégié de Lagos"],1,"Le terme désigne, parfois avec ironie, celles et ceux dont le séjour américain semble avoir modifié les façons de parler ou de se comporter.","Épisodes nigérians sur les retours et les attitudes « americanah ».","","AM-C11",""],
["con","ess","CON","Quelle est la dernière scène du roman ?",["Ifemelu repart aux États-Unis","Obinze quitte définitivement le Nigeria pour retourner vivre au Royaume-Uni","Ifemelu épouse Blaine","Obinze revient et Ifemelu l'invite à entrer"],3,"Après avoir expliqué ses choix, Obinze se présente chez Ifemelu. L'invitation finale ouvre un avenir qui reste à construire.","Chapitre 55.","La fin ne fait pas disparaître les responsabilités familiales ni les tensions.","AM-C12",""],
["con","ess","CON","Quelle structure narrative caractérise Americanah ?",["Un récit alternant retours en arrière et billets de blog","Un échange de longues lettres entre les deux amoureux séparés par les voyages","Un journal intégralement daté","Une confession à un médecin au couvent"],0,"Le récit croise plusieurs temporalités, notamment autour du départ et du retour, et insère des billets rédigés par Ifemelu.","Ouverture, épisodes passés et billets de blog.","","AM-C13",""],
["con","ess","CON","Quel contexte historique est central dans Americanah ?",["La société française de la fin du XVIIIe siècle et ses hiérarchies aristocratiques","Le Nigeria du XVIe siècle","Les migrations et les débats raciaux contemporains","Les guerres de la Restauration française"],2,"Le roman explore les mobilités, la race, les classes sociales et les identités à l'époque contemporaine.","Ensemble du roman.","","AM-C14",""],
["app","ess","INT,REL","Pourquoi les cheveux d'Ifemelu constituent-ils un enjeu important ?",["Ils ne servent qu'à représenter l'évolution de la mode dans les grandes villes","Ils révèlent des normes de beauté et des attentes sociales","Ils n'apparaissent que dans le dénouement","Ils représentent le même choix pour toutes les femmes"],1,"Les cheveux peuvent faire l'objet de pressions sociales et professionnelles, mais aussi devenir un lieu de choix et d'affirmation de soi.","Première partie et épisodes liés aux cheveux naturels.","La coiffure ne se réduit pas à un symbole politique.","AM-A01","Les normes de beauté dépendent de contextes sociaux et historiques."],
["app","ess","INT,REL","Que découvre Ifemelu à propos de la race aux États-Unis ?",["Qu'elle est classée comme noire dans le contexte américain","Qu'aucune discrimination n'existe aux États-Unis","Que les différences sociales ont disparu au Nigeria","Que la catégorie de race désigne toujours les mêmes réalités au Nigeria et aux États-Unis"],0,"Ifemelu constate que les catégories raciales américaines organisent la façon dont les autres la voient. Cette expérience déplace son regard sur elle-même.","Séjour américain et billets du blog.","Le Nigeria n'est pas pour autant présenté comme une société sans hiérarchies.","AM-A02","Les catégories raciales ont une histoire et des usages différents selon les pays."],
["app","ess","INT,REL","Que révèle le rapport d'Ifemelu à son accent ?",["Son refus durable de comprendre et d'utiliser la langue anglaise avec ses amis américains","Une simple imitation sans conséquence","Une tension entre adaptation et affirmation de sa voix","Le rejet de toutes les autres langues"],2,"Adopter ou abandonner un accent américain engage pour Ifemelu la question de l'intégration et de la voix personnelle.","Séjour américain, passages sur l'accent.","Un accent peut changer sans que la personne renonce nécessairement à elle-même.","AM-A03",""],
["app","ess","INT,REL","Quel est l'intérêt littéraire des billets de blog ?",["Ils remplacent tous les épisodes narratifs par une chronique chronologique des événements","Une voix critique et ironique intégrée au récit","Ils ne racontent que l'enfance d'Obinze","Ils sont un document historique extérieur au roman"],1,"Ces billets transforment des observations d'Ifemelu en commentaires plus généraux, que le lecteur peut confronter aux épisodes racontés.","Billets de Raceteenth dans les chapitres.","La voix d'Ifemelu ne se confond pas automatiquement avec la pensée de l'autrice.","AM-A04",""],
["app","ess","INT,REL","Que fait apparaître le séjour britannique d'Obinze ?",["Une existence entièrement stable et facile dès son arrivée sur le territoire britannique","Un destin identique à celui d'Ifemelu","Une migration sans difficultés juridiques","La précarité du travail et du statut légal"],3,"Les obstacles d'Obinze montrent que la migration implique des situations juridiques et sociales différentes selon les pays.","Partie consacrée au Royaume-Uni.","Sa trajectoire ne doit pas être transformée en généralité sur tous les migrants.","AM-A05","Les droits attachés au séjour sont déterminants pour accéder à un travail légal."],
["app","ess","INT,REL","Pourquoi le salon de coiffure est-il un lieu intéressant ?",["Des voix et parcours de migrantes qui se croisent","Un lieu où toutes les femmes immigrées décrivent exactement les mêmes expériences","Il ne sert qu'à dater le départ d'Ifemelu","Il supprime toute tension entre les personnages"],0,"Le salon met en contact des parcours et des opinions distincts. C'est un lieu concret où se croisent cheveux, travail et migration.","Première partie, chapitres 1-2.","Les femmes présentes ne parlent pas toutes d'une seule voix.","AM-A06",""],
["app","ess","INT,REL","Comment interpréter le retour d'Ifemelu à Lagos ?",["Comme l'effacement de toute expérience américaine","L'effacement complet de son expérience américaine et de ses souvenirs d'émigration","Une redécouverte de Lagos avec un regard transformé","Comme un départ définitivement manqué"],2,"Le retour associe familiarité, décalage et nouveaux choix. Après les États-Unis, Lagos paraît à Ifemelu à la fois connue et différente.","Parties du retour au Nigeria.","Le roman ne réduit pas ce retour à une réussite ou à un échec simples.","AM-A07",""],
["app","ess","INT,REL","Pourquoi l'histoire d'amour ne résume-t-elle pas tout Americanah ?",["Parce que les sentiments ne jouent aucun rôle","L'amour se mêle aux questions de migration et de race","Parce qu'Ifemelu et Obinze ne se sont jamais connus avant leurs départs respectifs","Parce que le roman ne traite que de politique"],1,"La relation entre Ifemelu et Obinze reste importante, mais se transforme au contact de leurs expériences sociales et migratoires.","Début du roman et chapitre 55.","Une lecture personnelle peut accorder une place essentielle à l'amour.","AM-A08",""],
["app","ess","INT,REL","Quel lien peut-on établir entre Zilia chez Graffigny et Ifemelu ?",["Elles vivent le même enlèvement","Elles écrivent toutes les deux des lettres régulières à un fiancé resté au pays","Elles voyagent à la même époque","Leurs regards décalés questionnent les habitudes sociales"],3,"Zilia questionne les mœurs françaises, Ifemelu observe les usages américains. Les deux regards rendent visibles des normes souvent tenues pour évidentes.","Graffigny : Lettres d'une Péruvienne ; Adichie : billets et séjour américain.","Le blog et le roman épistolaire ne remplissent pas exactement les mêmes fonctions.","AM-A09","Les contextes historiques et les conditions de leurs voyages diffèrent."],
["app","ess","INT,REL","Comment rapprocher Rica chez Montesquieu et Ifemelu ?",["Elles interrogent les jugements portés sur l'apparence","Ils racontent un même bal parisien","Les deux textes décrivent les mêmes catégories raciales, dans le même cadre historique","Leurs vêtements produisent toujours les mêmes réactions"],0,"La lettre 30 des Lettres persanes et certains épisodes d'Americanah montrent comment l'apparence peut faire écran à la singularité d'une personne.","Montesquieu : lettre 30 ; Adichie : cheveux et accent.","La comparaison repose sur un mécanisme, pas sur l'identité des situations.","AM-A10",""],
["app","ess","INT,REL","Comment rapprocher Americanah de la notion d'ethnocentrisme ?",["Toutes les sociétés possèdent les mêmes règles","Le roman rappelle que toutes les sociétés possèdent exactement les mêmes règles","Les normes d'un groupe sont parfois prises pour universelles","Le Nigeria est présenté comme une société sans préjugés"],2,"Les expériences dans différents pays montrent que ce qu'un groupe juge normal peut paraître étrange à un autre.","Texte d'Alain Testart sur l'ethnocentrisme ; épisodes migratoires.","Le décentrement ne signifie pas qu'une culture serait toujours supérieure à une autre.","AM-A11",""],
["app","ess","INT,REL","En quoi le roman dialogue-t-il avec « Un nouvel univers s'est offert à mes yeux » ?",["Il décrit uniquement une découverte géographique heureuse et sans tension intérieure","Découvrir l'ailleurs et redécouvrir son pays au retour","Il suppose que toute découverte soit heureuse","Il exclut les problèmes de langue et d'appartenance"],1,"Aux États-Unis et au retour à Lagos, Ifemelu découvre des normes sociales nouvelles et renouvelle son regard sur elle-même et son pays.","Parcours Graffigny ; séjour américain et retour au Nigeria.","Le rapprochement doit tenir compte de la distance entre le XVIIIe et le XXIe siècle.","AM-A12",""],
["dia","ess","DIA,ILL","Examinateur : « Pourquoi choisir le salon de coiffure comme passage marquant ? »",["« Le salon montre que toutes les femmes qui ont migré rencontrent exactement les mêmes difficultés sociales. »","« C'est un passage mineur sans lien avec le reste du roman. »","« Il raconte exclusivement une histoire de mode sans portée sociale. »","« Le salon fait entendre des voix diverses sur cheveux et migration. »"],3,"Le passage peut être choisi pour la façon dont il associe un lieu concret, plusieurs paroles et des questions d'identité.","Première partie, chapitre 1.","D'autres scènes peuvent être tout aussi pertinentes si elles sont précisément justifiées.","AM-D01",""],
["dia","ess","DIA,ILL","Examinateur : « Ifemelu critique-t-elle seulement les États-Unis ? »",["« Non, elle interroge aussi son pays et parfois elle-même. »","« Oui, Lagos est présenté comme une ville sans aucune tension sociale ou économique. »","« Oui, car son comportement personnel n'est jamais mis en question. »","« Non, car elle trouve toutes les cultures absolument identiques. »"],0,"Le roman fait apparaître des contradictions et des points aveugles dans plusieurs milieux ; il ne se contente pas d'opposer deux pays.","Parties américaines et retour à Lagos.","Distinguer le point de vue d'Ifemelu et les différentes voix du roman.","AM-D02",""],
["dia","ess","DIA,ILL","Examinateur : « Que nous apprend le parcours d'Obinze ? »",["« Il prouve que toutes les migrations se terminent par l'expulsion. »","« Le travail et le séjour précaires au Royaume-Uni. »","« Son parcours reproduit dans le détail les expériences américaines d'Ifemelu. »","« Il démontre que les diplômes garantissent un statut stable. »"],1,"Le parcours d'Obinze permet d'aborder les effets du statut administratif sur le travail et la dignité, sans réduire tous les migrants à un modèle.","Partie britannique d'Obinze.","","AM-D03",""],
["dia","ess","DIA,ILL","Examinateur : « Le blog exprime-t-il forcément l'avis de l'autrice ? »",["« Oui : les personnages de fiction doivent toujours être lus comme des porte-parole fidèles de leur auteur. »","« Non, les billets n'ont aucun rapport avec les thèmes du roman. »","« Le blog est la voix d'Ifemelu, distincte de celle de l'autrice. »","« Oui, tous les billets sont des documents historiques objectifs. »"],2,"Le blog participe à une construction littéraire. La voix d'Ifemelu est une composante du roman et ne doit pas être automatiquement attribuée à Chimamanda Ngozi Adichie.","Billets de blog et narration.","","AM-D04",""],
["dia","ess","DIA,ILL","Examinateur : « Quel point commun voyez-vous entre Ifemelu et Zilia ? »",["« Leurs regards interrogent des usages étrangers, dans des contextes différents. »","« Les deux héroïnes sont enlevées lors de la conquête espagnole avant de rejoindre la France. »","« Elles écrivent pour retrouver le même amour resté au pays. »","« Elles renoncent entièrement à leur culture après leur voyage. »"],0,"Le parallèle repose sur le regard décentré et l'observation critique ; les formes de la lettre et du blog diffèrent.","Graffigny : lettres ; Adichie : blog.","Toute comparaison doit aussi faire apparaître les différences.","AM-D05",""],
["dia","ess","DIA,ILL","Examinateur : « Les cheveux sont-ils seulement un détail physique ? »",["« Oui, les cheveux ne jouent aucun rôle dans la manière dont Ifemelu est perçue au travail. »","« Non, ils signifient que toutes les femmes ont les mêmes goûts. »","« Oui, ils ne concernent jamais le travail et les normes sociales. »","« Non, ils éclairent des normes de beauté et d'appartenance. »"],3,"Les cheveux fournissent un appui concret pour analyser les attentes sociales pesant sur l'apparence. Ils peuvent aussi relever de choix personnels.","Chapitre 1 et épisodes sur les cheveux.","","AM-D06",""],
["dia","ess","DIA,ILL","Examinateur : « Le retour au Nigeria résout-il toutes les difficultés ? »",["« Oui, Ifemelu reprend exactement sa vie d'avant, sans surprise ni changement de regard. »","« Non, elle redécouvre Lagos et fait de nouveaux choix. »","« Oui, le roman ne comporte plus aucune tension à la fin. »","« Non, elle ne revoit jamais Obinze après son retour. »"],1,"Le retour est une expérience nouvelle, et non un retour exact à la vie d'avant.","Dernières parties ; chapitre 55.","La fin est ouverte et appelle une lecture personnelle argumentée.","AM-D07",""],
["choix","ess","INT,REL","Quelle raison peut constituer un choix personnel pertinent d'Americanah ?",["« Il est obligatoire, donc mon avis n'a aucune importance. »","« La longueur du roman suffit à démontrer sa supériorité sur les autres œuvres proposées. »","« Une scène m'a interrogé sur le regard d'autrui, et je peux la citer. »","« Tous les élèves doivent préférer ce roman à d'autres. »"],2,"On attend une raison personnelle liée à une scène ou un aspect du livre, pas un goût imposé.","Passage librement choisi.","Une autre réaction personnelle peut tout aussi bien fonder le choix.","AM-P01",""],
["choix","ess","INT,REL","Tu dis : « Le blog m'a intéressé. » Comment justifier ce jugement ?",["« En expliquant quel billet ou quel ton m'a marqué et pourquoi. »","« En affirmant que tous les blogs sont forcément littéraires. »","« En disant que les billets suppriment toute histoire d'amour. »","« En répétant que le roman est moderne sans exemple. »"],0,"Une justification explicite un effet de lecture et s'appuie sur un billet ou une scène.","Billets de Raceteenth.","On peut tout aussi bien avoir préféré les passages narratifs.","AM-P02",""],
["choix","ess","INT,REL","Quelle introduction peut ouvrir un entretien sur Americanah ?",["« C'est un roman français du XVIIIe siècle qui suit une voyageuse venue du Pérou. »","« C'est une autobiographie sans personnages fictifs. »","« C'est un roman de 2013 entièrement situé en Grande-Bretagne. »","« Americanah, roman d'Adichie publié en 2013, explore migration et retour. »"],3,"Présenter brièvement le titre, l'autrice, la date, l'héroïne et le sujet permet ensuite d'expliquer son intérêt personnel.","Repères de l'édition et ensemble du récit.","Il ne s'agit pas d'une formule à réciter mot pour mot.","AM-P03",""],

const CONTEXTE={};
const MODULES={con:["🧭","Connaître","Personnages, intrigue, structure, contexte."],app:["🔎","S'approprier","Passages, interprétations et nuances."],dia:["💬","Dialoguer","Questions d'examinateur et réponses argumentées."],choix:["✦","Mon choix d'œuvre","Trouver tes raisons personnelles de présenter Americanah."]};
const app=document.getElementById("app");
let module=null,pos=0,selected=[],validated=false,optionOrders={};
function shuffledOrder(n){const a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orderForQuestion(index,n){return optionOrders[index]||(optionOrders[index]=shuffledOrder(n))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function home(){module=null;window.scrollTo(0,0);render()}
function start(m){module=m;pos=0;selected=[];validated=false;optionOrders={};window.scrollTo(0,0);render()}
function items(){return DATA.map((d,i)=>({d,i})).filter(x=>x.d[0]===module)}
function pick(i){if(validated)return;selected=[i];render()}
function correct(){return selected[0]===items()[pos].d[5]}
function validate(){if(!selected.length||validated)return;validated=true;render()}
function next(){if(pos+1>=items().length){pos=items().length;render();return}pos++;selected=[];validated=false;render()}
function render(){
if(!module){
app.innerHTML='<section class="hero"><div class="eyebrow">Lecture cursive · Préparation à l’entretien de l&#39;oral du bac français</div><h2>Connaître, interpréter, dialoguer</h2><p>Les activités t’aideront à mieux connaître le roman, à choisir des exemples précis et à préparer une lecture personnelle.</p><div class="principle">Une interprétation n’est pas une réponse à apprendre. Plusieurs lectures peuvent être défendues si elles respectent le texte et sont argumentées.</div></section><section class="modules">'+Object.entries(MODULES).map(([k,m])=>'<button class="module" data-module="'+k+'"><span class="sym">'+m[0]+'</span><strong>'+esc(m[1])+'</strong><span>'+esc(m[2])+'</span></button>').join('')+'</section>';
app.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>start(b.dataset.module));return}

const d=its[pos].d, ok=validated?correct():null, interpr=module!=="con", contexte=d[10], displayOrder=orderForQuestion(d[9],d[4].length);const ref=d[7], nuance=d[8]||"Cette réponse est une piste possible mais pas une formulation obligatoire. D'autres lectures argumentées peuvent être recevables.";
app.innerHTML='<div class="top"><button class="backbtn" id="return">← Activités</button><span class="small">'+esc(MODULES[module][1])+' · '+(pos+1)+' / '+its.length+'</span></div><section class="question">'+(module==="dia"?'<div class="challenge"><strong>Mode défi</strong>Avant de regarder les propositions, imagine ce que tu pourrais répondre. Les choix servent ensuite à comparer des stratégies d’argumentation.</div>':'')+'<h2>'+esc(d[3])+'</h2><div class="choices">'+displayOrder.map(i=>'<button data-choice="'+i+'" class="'+(validated&&i===d[5]?'good':validated&&selected[0]===i?'wrong':selected[0]===i?'picked':'')+'" '+(validated?'disabled':'')+'>'+esc(d[4][i])+'</button>').join('')+'</div>'+(validated?'<div class="feedback"><strong>'+(ok?'✓ Bonne réponse':'À reprendre')+'</strong>'+esc(d[6])+(interpr?'<div class="nuance">'+esc(nuance)+'</div>':'')+(contexte?'<div class="nuance"><strong>Repère de contexte</strong><div>'+esc(contexte)+'</div></div>':'')+'<div class="ref">Repère textuel : '+esc(ref)+'</div></div>':'')+'<div class="action"><button class="button" id="action" '+(!validated&&!selected.length?'disabled':'')+'>'+(validated?(pos+1===its.length?'Terminer l’activité':'Question suivante →'):'Valider ma réponse')+'</button></div></section>';

}
