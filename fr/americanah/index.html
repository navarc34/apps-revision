n-bottom:20px}.challenge strong{display:block}.footer{border-top:1px solid var(--border);margin-top:35px;padding-top:20px;font-size:13px;color:var(--muted);display:flex;gap:15px;justify-content:space-between}.footer button{background:none;border:0;text-decoration:underline;color:var(--muted)}.result h2{font-size:26px}.result p{color:var(--muted)}.list{padding-left:20px}

<body><main class="shell"><a class="back" href="../">← Toutes les révisions de français</a><header class="heading"><div><div class="eyebrow">Français · 1re ST2S · EAF 2027</div><h1>Americanah</h1><p>Chimamanda Ngozi Adichie · Lecture cursive · V1.1</p></div><span class="mark">A</span></header><div id="app"></div><footer class="footer"><span>Révision libre · Aucun résultat enregistré · Aucune saisie écrite ni enregistrement vocal</span></footer></main>
<script>
"use strict";
const DATA=[
["con","ess","CON","Qui est l’autrice d’Americanah ?",["Chimamanda Ngozi Adichie","Toni Morrison","Buchi Emecheta","Chinua Achebe"],0,"Americanah est un roman de Chimamanda Ngozi Adichie, autrice nigériane ; l’édition française fournie est traduite par Anne Damour.","Édition fournie : couverture et page de titre.","","AM-C01",""],
["con","ess","CON","En quelle année Americanah paraît-il en langue originale ?",["1998","2006","2013","2020"],2,"La première publication du roman date de 2013. L’histoire met en scène des mobilités et des expériences sociales contemporaines.","Repère éditorial : première publication, 2013.","","AM-C02",""],
["con","ess","CON","Quels sont les deux parcours amoureux et migratoires au cœur du roman ?",["Ifemelu et Blaine","Ifemelu et Obinze","Tante Uju et Bartholomew","Ranyinudo et Don"],1,"Le récit suit Ifemelu aux États-Unis et Obinze au Royaume-Uni, tout en remontant à leur jeunesse au Nigeria et en racontant leurs retrouvailles.","Chapitres 2–8, 23–30 et 51–55.","","AM-C03",""],
["con","ess","CON","Où se trouve Ifemelu lorsque débute le roman ?",["Dans un avion pour Lagos","À Londres chez Obinze","À Nsukka chez ses parents","À Princeton, avant d’aller se faire tresser à Trenton"],3,"L’ouverture, située à Princeton puis à Trenton, précède un long retour en arrière. Ifemelu prépare son départ des États-Unis.","Chapitre 1, p. 13–24 de l’édition fournie.","","AM-C04",""],
["con","ess","CON","Pourquoi Ifemelu part-elle poursuivre ses études aux États-Unis ?",["Les grèves universitaires au Nigeria rendent ses études incertaines","Elle reçoit un poste de professeure à Princeton","Obinze s’installe déjà à New York","Ses parents l’envoient rejoindre son mari"],0,"Les grèves à l’université nigériane interrompent les études. Ifemelu part tenter de construire son avenir universitaire aux États-Unis.","Chapitres 7–10, notamment chapitre 8.","","AM-C05",""],
["con","ess","CON","Que subit Obinze au Royaume-Uni après l’échec de son mariage de régularisation ?",["Il obtient un nouveau visa de travail","Il s’inscrit à l’université de Cambridge","Il est arrêté, détenu puis expulsé au Nigeria","Il rejoint Ifemelu à Princeton"],2,"Les agents d’immigration l’arrêtent au centre où il devait épouser Cleotilde ; son visa est expiré. Il passe par des centres de rétention avant son expulsion.","Chapitre 30, p. 410–420.","","AM-C06",""],
["con","ess","CON","Qui est Dike ?",["Le frère d’Obinze","Le fils de Tante Uju et le cousin d’Ifemelu","Le responsable de Raceteenth","Le mari de Ginika"],1,"Dike grandit aux États-Unis auprès de Tante Uju. Son expérience de l’identité et sa crise personnelle occupent une place majeure.","Chapitres 10–11, 41 et 43.","","AM-C07",""],
["con","ess","CON","Quel événement bouleverse Ifemelu à la fin de son séjour américain ?",["Blaine est arrêté à une manifestation","Tante Uju décide de rentrer au Nigeria","Curt ferme le blog d’Ifemelu","Dike fait une tentative de suicide"],3,"La nouvelle de la tentative de suicide de Dike conduit Ifemelu à le rejoindre et à s’interroger sur sa souffrance et les limites de son propre regard.","Chapitres 41 et 43, notamment p. 531 et suivantes.","","AM-C08",""],
["con","ess","CON","Quel rôle Wambui joue-t-elle dans la naissance du blog d’Ifemelu ?",["Elle encourage Ifemelu à transformer ses observations en billets publics","Elle finance le voyage de retour d’Ifemelu","Elle dirige le Nigerpolitan Club à Lagos","Elle compose les billets à la place d’Ifemelu"],0,"Après avoir lu un long courriel d’Ifemelu, Wambui l’encourage à créer son propre blog pour faire entendre une voix critique à un public plus large.","Chapitre 31, origine du blog.","","AM-C09",""],
["con","ess","CON","Quelle évolution connaît l’écriture publique d’Ifemelu après son retour à Lagos ?",["Elle renonce pour toujours à écrire","Elle devient chroniqueuse politique à Londres","Elle lance un nouveau blog consacré à la vie nigériane","Elle publie seulement des lettres privées à Obinze"],2,"Après avoir travaillé dans un magazine féminin, Ifemelu quitte ce poste et lance un blog portant un regard ironique et critique sur Lagos et ses milieux sociaux.","Chapitres 45–50, particulièrement 49–50.","","AM-C10",""],
["con","ess","CON","Dans quel lieu Ifemelu et Obinze se retrouvent-ils après son retour au Nigeria ?",["À l’aéroport de Lagos","À la librairie-café Jazzhole","Au salon Mariama African Hair Braiding","Dans l’ancien lycée de Nsukka"],1,"Après un appel téléphonique, ils conviennent de se retrouver au Jazzhole. Le lieu des livres et de la conversation donne une portée symbolique aux retrouvailles.","Chapitre 51, p. 614–623.","","AM-C11",""],
["con","ess","CON","Sur quelle action se termine le roman ?",["Ifemelu quitte Lagos une nouvelle fois","Kosi demande le divorce devant la justice","Obinze repart vivre au Royaume-Uni","Ifemelu invite Obinze à entrer chez elle"],3,"Obinze revient vers Ifemelu et lui demande une chance ; l’invitation finale à entrer laisse ouverts leurs choix et leurs conséquences.","Chapitre 55, fin du roman.","","AM-C12",""],
["app","av","INT,REL","À quoi sert la scène du salon de coiffure dans la construction du récit ?",["Elle met en relation plusieurs expériences migratoires avant le retour d’Ifemelu","Elle présente les immigrées africaines comme un groupe entièrement homogène","Elle livre une chronologie complète de la vie d’Obinze","Elle marque le moment où Ifemelu abandonne toute idée du Nigeria"],0,"Le salon de Trenton fait entendre plusieurs voix et sert de cadre au récit rétrospectif ; la coiffure, le travail, les pays d’origine et les jugements sociaux s’y croisent.","Chapitres 1, 3, 9, 18 et 41.","L’opinion d’Ifemelu ne résume pas celles des coiffeuses.","AM-A01",""],
["app","av","INT,REL","Que montre l’entretien professionnel où l’on conseille à Ifemelu de défriser ses cheveux ?",["Que son diplôme dépend de sa coiffure","Qu’elle abandonne volontairement ses études","Que des normes d’apparence peuvent conditionner les chances professionnelles","Que la coiffure naturelle est interdite par une loi fédérale"],2,"Le conseil de défriser ses cheveux avant l’entretien montre comment des normes implicites de présentation peuvent devenir des obstacles ou des stratégies d’adaptation.","Chapitre 19, passage de la préparation à un entretien à Baltimore.","La critique vise la pression sociale, non les femmes qui choisissent de se défriser les cheveux.","AM-A02",""],
["app","av","INT,REL","Que révèle la décision d’Ifemelu de cesser de prendre un accent américain ?",["Une incapacité à maîtriser l’anglais","Un choix de moins se conformer aux attentes d’autrui","Une volonté de rompre avec les étudiants africains","Une preuve que tous les accents restent immuables"],1,"Ifemelu a appris à reproduire un accent américain crédible, puis décide de ne plus le faire : le récit interroge le désir de reconnaissance et l’affirmation de soi.","Chapitre 17, ouverture.","Changer d’accent peut aussi relever d’un choix pragmatique : le roman n’en fait pas une faute.","AM-A03",""],
["app","av","INT,REL","Comment comprendre la discussion universitaire sur une insulte raciale et son emploi dans un film ?",["Comme la preuve que tous les étudiants ont le même avis","Comme une leçon affirmant que l’histoire n’a aucun rapport avec les mots","Comme une querelle uniquement personnelle sans enjeu historique","Comme un débat sur les mots, les voix qui les prononcent et la mémoire de l’esclavage"],3,"La discussion confronte plusieurs points de vue sur la représentation d’un terme raciste et sa charge historique. Elle éclaire le rapport d’Ifemelu à la société américaine.","Chapitre 14, p. 208–210.","Ne pas reproduire le terme injurieux comme s’il était neutre ; distinguer les positions exprimées dans le dialogue.","AM-A04","Le débat fait explicitement référence à la traite transatlantique et à ses héritages."],
["app","av","INT,REL","Pourquoi le travail précaire d’Ifemelu au début de son séjour est-il décisif ?",["Il rend concrètes sa vulnérabilité économique, sa honte et la rupture du lien avec Obinze","Il lui procure immédiatement une indépendance financière confortable","Il s’explique uniquement par son manque de diplômes","Il démontre qu’elle ne souhaite plus étudier"],0,"Au chapitre 15, la recherche d’un emploi et l’épisode humiliant chez un homme proposant un travail ambigu conduisent à une détresse profonde et à une rupture de communication avec Obinze.","Chapitres 13–16, particulièrement chapitre 15, p. 217 et suivantes.","Traiter cet épisode de vulnérabilité sexuelle sans faire porter la responsabilité de la situation à Ifemelu.","AM-A05",""],
["app","av","INT,REL","Que révèle le parcours d’Obinze au Royaume-Uni sur les migrations ?",["Que seuls les réfugiés de guerre souhaitent émigrer","Que le travail régulier suffit à garantir le droit au séjour","Que le désir d’un avenir plus ouvert peut aussi conduire au départ","Que l’expulsion restaure immédiatement son bonheur"],2,"Obinze veut échapper à l’étroitesse de ses perspectives. Le récit souligne des migrations motivées aussi par le désir d’avoir des choix, et non uniquement par une catastrophe.","Chapitre 29, fin ; chapitre 30.","Les expériences migratoires sont diverses ; aucun personnage ne représente tous les migrants.","AM-A06",""],
["app","av","INT,REL","Pourquoi Ifemelu peut-elle se sentir à la fois proche et distante de Lagos à son retour ?",["Elle a oublié sa langue et tous ses souvenirs","Son séjour américain transforme le regard qu’elle porte sur son pays","Les lieux sont restés rigoureusement inchangés","Elle souhaite revenir définitivement à Princeton dès le premier jour"],1,"Dans le retour à Lagos, la familiarité côtoie l’étonnement : Ifemelu remarque les bruits, les rapports sociaux, les habitudes et le regard qu’on lui renvoie.","Chapitre 44, premières impressions et échanges avec Ranyinudo.","Le retour n’est ni une réussite simple ni une désillusion totale.","AM-A07",""],
["app","av","INT,REL","Que met en évidence le Nigerpolitan Club ?",["Une association chargée des permis de séjour britanniques","Un mouvement de soutien au candidat Barack Obama","Un groupe d’anciens élèves du lycée d’Ifemelu","Les habitudes et les contradictions de Nigérians revenus de l’étranger"],3,"Le club réunit des personnes revenues vivre au Nigeria ; leurs jugements et leurs nostalgies permettent à Ifemelu d’exercer son ironie, sans s’exclure elle-même complètement de cette critique.","Chapitres 48 et 50.","Le roman observe avec distance les nouveaux usages de son héroïne aussi bien que ceux du groupe.","AM-A08",""],
["app","av","INT,REL","Quel intérêt présente la construction du roman par retours en arrière et déplacements de point de vue ?",["Elle fait résonner le présent du retour avec les expériences passées d’Ifemelu et d’Obinze","Elle empêche de distinguer les deux personnages principaux","Elle réduit le roman à un journal personnel daté","Elle écarte les épisodes qui se déroulent au Nigeria"],0,"La narration commence près du retour, remonte à l’adolescence et croise deux trajectoires migratoires ; les billets de blog y ajoutent une voix d’observation sociale.","Chapitres 1–2, 3–8, 23–30 et 44–55.","","AM-A09",""],
["app","av","INT,REL","Quelle nuance apporte le destin de Dike au tableau de l’immigration ?",["Il prouve que toute jeunesse américaine est heureuse","Il efface les conflits entre la mère et son fils","Il révèle la souffrance possible derrière une réussite matérielle apparente","Il confirme que l’appartenance se résume aux papiers d’identité"],2,"La tentative de suicide de Dike oblige à considérer ses expériences, ses silences et les jugements des adultes. La visite ultérieure au Nigeria nourrit ses questions d’appartenance.","Chapitres 41, 43 et 50.","Ne pas réduire une crise psychique à une cause unique ni suggérer que l’expatriation conduit nécessairement à celle-ci.","AM-A10",""],
["app","av","INT,REL","Quel rapprochement est le plus fécond avec Zilia dans les Lettres d’une Péruvienne ?",["Les deux héroïnes voyagent pour les mêmes raisons","Le regard décentré révèle des habitudes sociales que d’autres ne questionnent pas","Les deux intrigues s’achèvent sur le même mariage","Les deux textes ont la forme d’un blog contemporain"],1,"Zilia observe la France ; Ifemelu examine les États-Unis puis le Nigeria. Le décentrement peut dévoiler des normes implicites, mais les œuvres appartiennent à des époques et à des formes différentes.","Adichie, chapitres 14, 17 et 44 ; Graffigny, lettres étudiées en classe.","La comparaison est un outil de lecture, pas une justification obligatoire du choix de l’œuvre.","AM-A11",""],
["app","av","INT,REL","Comment Americanah éclaire-t-il le parcours « Un nouvel univers s’est offert à mes yeux » ?",["Le roman présente la découverte comme nécessairement heureuse","Il impose de ne parler que de voyages géographiques","Il fait disparaître tout attachement au pays d’origine","La découverte de l’ailleurs modifie aussi le regard porté sur soi et sur son pays"],3,"Ifemelu découvre aux États-Unis des codes qu’elle n’avait pas nommés auparavant ; son retour transforme ensuite la manière dont elle voit Lagos. Le « nouvel univers » est aussi social et intérieur.","Chapitres 14–17, 44 et 51.","Il faut marquer la distance entre le contexte de Graffigny et celui d’Adichie.","AM-A12",""],
["dia","av","DIA,ILL","Examinateur : « Pourquoi avoir choisi le chapitre 15 comme passage décisif ? »",["« Il relie précarité, humiliation et rupture de la communication avec Obinze. »","« Il montre que les études d’Ifemelu sont déjà couronnées de succès. »","« Il raconte l’arrestation d’Obinze pendant son mariage. »","« Il explique principalement la réussite du blog à Lagos. »"],0,"Une justification solide identifie les conséquences de l’épisode sur la vie intérieure d’Ifemelu et son lien avec Obinze ; d’autres passages peuvent bien sûr être défendus.","Chapitre 15, p. 217 et suivantes.","Le choix d’un passage est personnel : on évalue la qualité de son explication.","AM-D01",""],
["dia","av","DIA,ILL","Examinateur : « Le blog d’Ifemelu exprime-t-il directement la pensée d’Adichie ? »",["« Oui, puisque tout blog est automatiquement autobiographique. »","« Non, les billets n’ont aucun rapport avec l’intrigue. »","« C’est une voix fictive critique, intégrée à une construction romanesque. »","« Oui, chaque billet expose une vérité historique incontestable. »"],2,"Il faut distinguer la voix du personnage et celle de l’autrice, même quand le roman met en scène un discours engagé et ironique.","Chapitres 1 et 31 ; billets de Raceteenth dans le roman.","","AM-D02",""],
["dia","av","DIA,ILL","Examinateur : « Ifemelu juge-t-elle uniquement la société américaine ? »",["« Oui, car elle estime que Lagos ne connaît aucune inégalité. »","« Non, elle observe aussi les codes de Lagos et ses propres contradictions. »","« Oui, elle refuse toute critique de son milieu d’origine. »","« Non, mais toutes les sociétés sont décrites comme identiques. »"],1,"Au retour, le regard critique se déplace vers Lagos, ses milieux aisés, les médias et les groupes de « retours » ; l’ironie peut également atteindre Ifemelu.","Chapitres 44, 48–50.","Distinguer la voix d’Ifemelu des jugements définitifs qu’on pourrait attribuer à l’ensemble du roman.","AM-D03",""],
["dia","av","DIA,ILL","Examinateur : « Que nous apprend l’épisode de l’arrestation d’Obinze ? »",["« Il prouve que le mariage est présenté comme une solution sans risque. »","« Il montre que le Nigeria ne joue plus aucun rôle dans sa vie. »","« Il signifie que tous les migrants sont condamnés à la détention. »","« Il donne à voir concrètement la perte de liberté et la violence de l’expulsion. »"],3,"Le texte insiste sur les menottes, la cellule, le regard des autres et l’effacement de la dignité. Ces détails donnent chair à un statut administratif.","Chapitre 30, p. 410–420.","Cette situation particulière ne doit pas être généralisée.","AM-D04",""],
["dia","av","DIA,ILL","Examinateur : « Le roman est-il seulement une histoire d’amour ? »",["« L’amour est central, mais s’inscrit dans les tensions de classe, de race et de migration. »","« Oui, les intrigues migratoires n’ont aucune conséquence sur le couple. »","« Non, Ifemelu et Obinze ne se sont jamais aimés. »","« Oui, les billets de blog racontent uniquement leur relation. »"],0,"Le roman associe les retrouvailles amoureuses aux transformations sociales des personnages et à leurs responsabilités envers d’autres personnes, en particulier Kosi et Buchi.","Chapitres 4–8 et 51–55.","Une lecture personnelle peut faire de l’amour son fil directeur sans effacer le reste du roman.","AM-D05",""],
["dia","av","DIA,ILL","Examinateur : « Que peut-on dire de la dernière scène sans prétendre tout résoudre ? »",["« Elle efface le mariage et la fille d’Obinze. »","« Elle prouve qu’Ifemelu souhaite retourner vivre à Princeton. »","« Elle laisse entrevoir une reprise possible, sans supprimer les conséquences des choix. »","« Elle montre que le narrateur abandonne définitivement Ifemelu. »"],2,"L’invitation finale constitue un geste d’ouverture. Elle ne fournit ni bilan moral simpliste ni solution explicite à toutes les tensions du couple et de la famille.","Chapitre 55, dernières pages.","Une autre lecture du dénouement reste recevable si elle prend appui sur le texte.","AM-D06",""],
["choix","av","PRE,JUS","Quelle manière de justifier son choix d’Americanah est la plus convaincante ?",["« Il est plus long que les autres romans, donc il faut le choisir. »","« Un épisode sur les cheveux m’a marqué et je peux expliquer pourquoi. »","« Le professeur a proposé ce titre, cela suffit à expliquer mon choix. »","« Tout élève doit ressentir la même chose devant ce roman. »"],1,"À l’oral, une raison personnelle gagne en force lorsqu’elle s’appuie sur une scène précise et explique un effet de lecture.","Chapitres 1 et 19, ou autre épisode choisi.","La scène et la réaction sont libres : ce n’est qu’un exemple de justification recevable.","AM-P01",""],
["choix","av","PRE,JUS","Comment dépasser le résumé si l’on a été frappé par l’histoire de Dike ?",["« Redire tous les événements du récit sans commenter. »","« Affirmer que la situation de Dike explique toutes les migrations. »","« Transformer son histoire en un diagnostic médical certain. »","« Expliquer ce que cet épisode m’a fait comprendre, en m’appuyant sur le texte. »"],3,"On peut évoquer une émotion, une interrogation ou un désaccord en indiquant ce qui, dans le récit, l’a suscité. Ce n’est pas une réponse personnelle imposée.","Chapitres 41, 43 et 50.","Éviter les conclusions générales hâtives et les diagnostics sur un personnage.","AM-P02",""],
["choix","av","PRE,JUS","Quelle présentation orale situe correctement le roman ?",["« Adichie publie en 2013 un roman centré sur Ifemelu, Obinze et l’expérience du départ et du retour. »","« Adichie écrit au XVIIIe siècle une correspondance entre deux Péruviens. »","« Americanah est une autobiographie racontant exclusivement l’enfance d’Obinze. »","« Le livre paraît au XIXe siècle et se déroule uniquement au Royaume-Uni. »"],0,"Une introduction brève peut associer autrice, date, personnages, lieux et enjeux, puis ouvrir sur une raison personnelle de choisir l’œuvre.","Repères éditoriaux ; chapitres 1–2 et 55.","La présentation n’a pas à être apprise mot pour mot.","AM-P03",""],

const CONTEXTE={};
const MODULES={con:["🧭","Connaître","Personnages, intrigue, structure, contexte."],app:["🔎","S'approprier","Passages, interprétations et nuances."],dia:["💬","Dialoguer","Questions d'examinateur et réponses argumentées."],choix:["✦","Mon choix d'œuvre","Trouver tes raisons personnelles de présenter Americanah."]};
const app=document.getElementById("app");
let module=null,pos=0,selected=[],validated=false,optionOrders={};
function shuffledOrder(n){const a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orderForQuestion(index,n){return optionOrders[index]||(optionOrders[index]=shuffledOrder(n))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function home(){module=null;window.scrollTo(0,0);render()}
function start(m){module=m;pos=0;selected=[];validated=false;optionOrders={};window.scrollTo(0,0);render()}
function items(){return DATA.map((d,i)=>({d,i})).filter(x=>x.d[0]===module)}
function pick(i){if(validated)return;selected=[i];render()}
function correct(){return selected[0]===items()[pos].d[5]}
function validate(){if(!selected.length||validated)return;validated=true;render()}
function next(){if(pos+1>=items().length){pos=items().length;render();return}pos++;selected=[];validated=false;render()}
function render(){
if(!module){
app.innerHTML='<section class="hero"><div class="eyebrow">Lecture cursive · Préparation à l’entretien de l&#39;oral du bac français</div><h2>Connaître, interpréter, dialoguer</h2><p>Les activités t’aideront à mieux connaître le roman, à choisir des exemples précis et à préparer une lecture personnelle.</p><div class="principle">Une interprétation n’est pas une réponse à apprendre. Plusieurs lectures peuvent être défendues si elles respectent le texte et sont argumentées.</div></section><section class="modules">'+Object.entries(MODULES).map(([k,m])=>'<button class="module" data-module="'+k+'"><span class="sym">'+m[0]+'</span><strong>'+esc(m[1])+'</strong><span>'+esc(m[2])+'</span></button>').join('')+'</section>';
app.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>start(b.dataset.module));return}
const its=items();if(pos>=its.length){app.innerHTML='<section class="result"><div class="eyebrow">Activité terminée</div><h2>'+esc(MODULES[module][1])+'</h2><p>Tu as terminé les questions de cette activité. Tu peux revoir les passages cités dans les corrections, puis reprendre les questions librement.</p><button class="button" id="return">Retour aux activités</button></section>';document.getElementById("return").onclick=home;return}
const d=its[pos].d, ok=validated?correct():null, interpr=module!=="con", contexte=d[10], displayOrder=orderForQuestion(d[9],d[4].length);const ref=d[7], nuance=d[8]||"Cette réponse est une piste possible mais pas une formulation obligatoire. D'autres lectures argumentées peuvent être recevables.";
app.innerHTML='<div class="top"><button class="backbtn" id="return">← Activités</button><span class="small">'+esc(MODULES[module][1])+' · '+(pos+1)+' / '+its.length+'</span></div><section class="question">'+(module==="dia"?'<div class="challenge"><strong>Mode défi</strong>Avant de regarder les propositions, imagine ce que tu pourrais répondre. Les choix servent ensuite à comparer des stratégies d’argumentation.</div>':'')+'<h2>'+esc(d[3])+'</h2><div class="choices">'+displayOrder.map(i=>'<button data-choice="'+i+'" class="'+(validated&&i===d[5]?'good':validated&&selected[0]===i?'wrong':selected[0]===i?'picked':'')+'" '+(validated?'disabled':'')+'>'+esc(d[4][i])+'</button>').join('')+'</div>'+(validated?'<div class="feedback"><strong>'+(ok?'✓ Bonne réponse':'À reprendre')+'</strong>'+esc(d[6])+(interpr?'<div class="nuance">'+esc(nuance)+'</div>':'')+(contexte?'<div class="nuance"><strong>Repère de contexte</strong><div>'+esc(contexte)+'</div></div>':'')+'<div class="ref">Repère textuel : '+esc(ref)+'</div></div>':'')+'<div class="action"><button class="button" id="action" '+(!validated&&!selected.length?'disabled':'')+'>'+(validated?(pos+1===its.length?'Terminer l’activité':'Question suivante →'):'Valider ma réponse')+'</button></div></section>';
document.getElementById("return").onclick=home;
app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>pick(Number(b.dataset.choice)));
document.getElementById("action").onclick=validated?next:validate;
}
render();
</script></body></html>
