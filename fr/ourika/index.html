body{background:var(--cream);color:var(--ink);font-size:17px;line-height:1.6}.shell{max-width:820px;margin:0 auto;padding:28px 20px 70px}.back{font-size:15px;text-decoration:none;color:var(--green);font-weight:700}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:18px 0 28px}.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#747978;font-weight:800}.heading h1{font-size:clamp(34px,6vw,47px);margin:0;letter-spacing:-.04em;line-height:1.1}.heading p{margin:5px 0;color:var(--muted)}.mark{display:grid;place-items:center;width:70px;height:70px;border:1px solid #d8dfdb;border-radius:50%;font:italic 35px Georgia,serif;color:var(--green)}
.hero,.panel,.question,.result{background:white;border:1px solid var(--border);border-radius:20px;padding:28px;margin-bottom:20px;box-shadow:0 9px 35px -30px #6d6d6d}.hero h2{font-size:27px;margin:5px 0 12px;line-height:1.3}.hero p{margin:0 0 14px;color:var(--muted)}.principle{border-left:3px solid var(--green);padding:12px 16px;background:#f1f7f4;border-radius:0 10px 10px 0;font-size:15px;color:#36544b}.modules{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.module{border:1px solid var(--border);border-radius:17px;text-align:left;background:white;padding:20px;min-height:170px;cursor:pointer}.module:hover{border-color:var(--green);background:#fbfdfc}.module .sym{font-size:24px}.module strong{display:block;font-size:21px;margin:9px 0 4px}.module span:last-child{display:block;color:var(--muted);font-size:15px;line-height:1.55}
.small{font-size:14px;color:var(--muted)}.levels{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.levels button{border:1px solid #daddd9;background:white;border-radius:30px;padding:10px 17px;color:var(--ink);font-size:15px;font-weight:700}.levels button.active{background:var(--green);border-color:var(--green);color:white}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.backbtn{border:0;background:transparent;color:var(--green);font-weight:800;padding:8px 0}.bar{height:8px;background:#e9efec;border-radius:10px;overflow:hidden;margin:20px 0}.bar div{height:100%;background:var(--green);transition:width .2s}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tag{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;padding:5px 9px;border-radius:7px;color:#35685b;background:#eaf4ef}.question h2{font-size:23px;line-height:1.42;margin:0 0 22px}.choices{display:grid;gap:11px}.choices button{font:inherit;text-align:left;border:1px solid #dcdedc;background:#fdfdfc;padding:15px 17px;border-radius:12px;line-height:1.55;min-height:55px}.choices button.picked{background:#e7f3ee;border-color:#4e9b81}.choices button.good{background:#e4f8ea;border-color:#65ae7f}.choices button.wrong{background:#fff1ef;border-color:#d79c93}.choices button:disabled{color:inherit;opacity:1}.button{border:0;background:var(--green);color:white;padding:13px 20px;border-radius:30px;font-size:16px;font-weight:800;cursor:pointer}.button:disabled{opacity:.45;cursor:default}.action{margin-top:20px;display:flex;justify-content:flex-end}.feedback{padding:19px;margin-top:21px;border-radius:13px;background:#f3f8f5;border:1px solid #d8e9e0;font-size:16px;line-height:1.7}.feedback strong{display:block;margin-bottom:9px}.feedback .nuance{margin-top:14px;padding:12px;background:#fffdfa;border-left:3px solid #ac8e61}.ref{font-size:14px;color:#5e6469;margin-top:13px}.challenge{border:1px dashed #b5beae;border-radius:12px;padding:15px;background:#f8faf7;margin-bottom:20px}.challenge strong{display:block}.footer{border-top:1px solid var(--border);margin-top:35px;padding-top:20px;font-size:13px;color:var(--muted);display:flex;gap:15px;justify-content:space-between}.footer button{background:none;border:0;text-decoration:underline;color:var(--muted)}.result h2{font-size:26px}.result p{color:var(--muted)}.list{padding-left:20px}

<body><main class="shell"><a class="back" href="../">← Toutes les révisions de français</a><header class="heading"><div><div class="eyebrow">Français · 1re ST2S · EAF 2027</div><h1>Ourika</h1><p>Claire de Duras · Lecture cursive · V1.0</p></div><span class="mark">O</span></header><div id="app"></div><footer class="footer"><span>Révision libre · Aucun résultat enregistré · Aucune saisie écrite ni enregistrement vocal</span></footer></main>
<script>
"use strict";
const DATA=[
["con","ess","CON","Comment le lecteur découvre-t-il l'histoire d'Ourika ?",["Par un échange de lettres","Par la confidence d'Ourika à un médecin venu la soigner au couvent","Par le journal de Charles","Par le témoignage de Mme de B."],1,"Le médecin raconte sa rencontre avec Ourika puis lui laisse la parole. Cette construction est un récit enchâssé.","Ouverture : rencontre au couvent, puis récit d'Ourika."],
["con","ess","CON","D'où vient Ourika ?",["Du Sénégal, d'où elle a été emmenée enfant","De Saint-Domingue, où elle a grandi","De Londres, où elle a étudié","De Marseille, où elle est née"],0,"Le chevalier de B. achète Ourika alors qu'elle allait être embarquée sur un navire négrier, c'est-à-dire un bateau utilisé pour transporter de force des personnes réduites en esclavage dans le cadre de la traite esclavagiste. Il la rapporte du Sénégal en France à l'âge de deux ans.","Début du récit d'Ourika : arrivée en France."],
["con","ess","CON","Qui accueille et élève Ourika ?",["La marquise de Thémines","Une religieuse ursuline","Madame de B.","La mère de Charles"],2,"Mme de B. élève Ourika dans son salon aristocratique, avec beaucoup d'affection et une excellente éducation.","Enfance auprès de Mme de B."],
["con","ess","CON","Quelle scène brise l'insouciance d'Ourika ?",["La lecture d'une lettre de Charles","Le bal de la Comba","La conversation entendue derrière un paravent","Une dispute avec Anaïs"],2,"Ourika entend Mme de B. et la marquise s'inquiéter de son avenir et évoquer l'impossibilité de son mariage en raison des préjugés raciaux. Elle comprend soudain la place que la société lui assigne.","Conversation derrière le paravent."],
["con","ess","CON","Quel lien unit Charles et Ourika pendant l'enfance ?",["Ils grandissent ensemble ; Charles est son ami et son protecteur","Ils sont fiancés","Ils ne se rencontrent qu'à l'âge adulte","Ils sont frère et sœur biologiques"],0,"Charles est le petit-fils de Mme de B. et le compagnon d'enfance d'Ourika. La nature du sentiment d'Ourika pour lui devient ensuite un enjeu d'interprétation.","Enfance et retrouvailles avec Charles."],
["con","ess","CON","Qui Charles épouse-t-il ?",["Ourika","La marquise de…","Anaïs de Thémines","Une jeune femme italienne"],2,"Charles épouse Anaïs de Thémines. Leur bonheur conjugal, puis la naissance de leur enfant, renforcent la solitude ressentie par Ourika.","Mariage de Charles et naissance de son fils."],
["con","ess","CON","Comment se termine l'histoire ?",["Ourika quitte la France","Ourika se marie","Ourika devient religieuse puis meurt au couvent","Ourika se réconcilie avec la marquise"],2,"Ourika trouve un apaisement dans la religion et choisit la vie conventuelle. Le médecin rapporte qu'elle meurt à la fin d'octobre.","Dénouement et dernière phrase du récit."],
["con","ess","CON","Quel sentiment traverse le roman comme un refrain ?",["L'ambition politique","La solitude et le sentiment d'être exclue","La nostalgie de l'Italie","La passion de la gloire"],1,"« Seule, pour toujours seule » : la répétition signale l'obsession d'une vie privée de liens pleinement reconnus.","Après la scène du paravent."],
["con","av","CON","Quel espoir la Révolution inspire-t-elle un temps à Ourika ?",["L'espoir de devenir reine","L'espoir que la remise en cause des rangs et des préjugés lui permette de trouver une place","L'espoir de devenir médecin","L'espoir d'épouser Charles sans lui parler"],1,"Ourika imagine que les bouleversements sociaux pourraient diminuer son exclusion. Cet espoir est rapidement déçu.","Réflexions d'Ourika sur la Révolution."],
["con","av","CON","Pourquoi la fin de la Terreur ne signifie-t-elle pas simplement le bonheur pour Ourika ?",["Elle perd ses langues étrangères","Elle est forcée de partir en Afrique","La vie mondaine reprend et les normes sociales qui l'excluent reviennent au premier plan","Mme de B. ne la reconnaît plus"],2,"Pendant la Terreur, les malheurs partagés avaient atténué son sentiment d'exclusion ; le retour de la société mondaine réactive ce sentiment.","Après la fin de la Terreur."],
["con","ess","CON","Qui a écrit Ourika ?",["Françoise de Graffigny","Claire de Duras","Madame de Staël","George Sand"],1,"Claire de Duras (1777-1828) est une écrivaine française issue de l'aristocratie. Elle tient à Paris un salon littéraire et politique influent sous la Restauration.","Présentation de Claire de Duras ; contexte de publication."],
["con","ess","CON","En quelle année Ourika paraît-il pour la première fois ?",["1747","1789","1823","1848"],2,"Le roman paraît d'abord anonymement, à la fin de 1823, en très petit tirage. Une édition destinée à la vente paraît chez Ladvocat en mars 1824. Distingue la première publication et l'édition commerciale.","Première publication (1823) et édition Ladvocat (1824)."],
["con","av","CON","À quel siècle rattacher Ourika et comment situer sa publication ?",["Au XVIIe siècle, sous Louis XIV","Au XVIIIe siècle, avant la Révolution","Au début du XIXe siècle, sous la Restauration","À la fin du XIXe siècle, sous la IIIe République"],2,"Ourika est publié au début du XIXe siècle, sous la Restauration (1814-1830). Son intrigue revient en arrière sur les dernières années de l'Ancien Régime et la Révolution française.","Contexte de publication et épisodes révolutionnaires du récit."],
["con","av","CON","À quelle sensibilité littéraire peut-on rapprocher Ourika ?",["Uniquement au classicisme du XVIIe siècle","Au roman sentimental du début du XIXe siècle, à l'époque de l'essor du romantisme, avec une écriture concise héritée de la tradition classique","Au naturalisme de la fin du XIXe siècle","Au théâtre de l'absurde du XXe siècle"],1,"Ourika explore la solitude et la souffrance intérieure. Il paraît au moment où se développe le romantisme français, mais hérite aussi du roman sentimental et de la sobriété d'écriture classique. Évite de le réduire à une seule étiquette.","Roman sentimental, sensibilité romantique, héritage classique."],
["con","av","CON","Quels bouleversements historiques traversent l'histoire racontée par Ourika ?",["La Révolution française, la Terreur et les événements de Saint-Domingue","La Première Guerre mondiale","La Commune de Paris","Les deux guerres mondiales"],0,"Le destin intime d'Ourika se déroule sur fond de Révolution française, de Terreur et de révolte à Saint-Domingue. Ces événements bouleversent les hiérarchies de naissance, de couleur et de statut sans effacer les préjugés.","Passages sur la Révolution, la Terreur et Saint-Domingue."],
["app","ess","INT,ILL","Quelle scène soutient le mieux l'idée que le regard social change l'image qu'Ourika a d'elle-même ?",["Les leçons d'italien","Après le paravent, elle ne supporte plus son reflet et cache son corps","Les promenades en forêt","La conversation du vieil abbé"],1,"Le regard des autres est intériorisé : après avoir entendu les préjugés de son entourage, Ourika se juge elle-même à travers eux.","Après le paravent : miroir, mains, vêtements."],
["app","ess","INT,NUA","« Ourika souffre uniquement parce qu'elle aime Charles » : quelle réponse est la plus convaincante ?",["Oui, tout commence avec le mariage de Charles","C'est trop simple : la découverte de son exclusion sociale précède l'accusation d'amour malheureux","Non, Charles ne compte pas dans l'histoire","Oui, Mme de B. le dit dès son enfance"],1,"La chronologie du texte empêche de réduire toute la douleur à une passion amoureuse. La question de l'amour peut cependant enrichir l'analyse.","Scène du paravent, puis seconde conversation avec la marquise.","Une autre interprétation peut donner une place importante à l'amour, à condition de tenir compte de l'exclusion déjà vécue."],
["app","ess","INT,ILL","Quel passage permet d'évoquer le désir d'Ourika de vivre des liens familiaux ?",["Elle se croit privée de la possibilité d'être « la sœur, la femme, la mère de personne »","Elle apprend à peindre","Elle danse avec succès","Le médecin entre au couvent"],0,"La formule exprime la force des normes familiales et le sentiment d'en être exclue.","Réflexions sur la famille et l'isolement."],
["app","av","INT,NUA","Comment comprendre le rôle de Mme de B. ?",["Elle est volontairement malveillante","Elle n'a aucune influence sur Ourika","Elle aime sincèrement Ourika, mais son éducation brillante ne suffit pas à lui assurer une place reconnue dans la société","Elle ignore totalement l'existence des préjugés"],2,"La bonté de Mme de B. et les conséquences douloureuses de son projet éducatif coexistent. Cette contradiction rend le personnage complexe.","Éducation, conversation du paravent, derniers échanges.","Il ne s'agit pas de désigner un coupable unique : plusieurs responsabilités et contradictions peuvent être analysées."],
["app","av","INT,NUA","Le bal de la Comba est-il une scène heureuse ou une scène d'exclusion ?",["Seulement heureuse","Seulement humiliante","Heureuse dans le souvenir de l'enfant, mais ambiguë à la lumière du regard social mis au jour ensuite","Sans importance"],2,"Ourika éprouve alors un plaisir réel, mais le récit rétrospectif invite à interroger son rôle de spectacle représentant l'Afrique.","Bal puis conversation du paravent.","La nuance importe : la relecture critique ne doit pas effacer le bonheur effectivement ressenti sur le moment."],
["app","av","INT,NUA","Comment envisager l'entrée d'Ourika au couvent ?",["Comme une délivrance sans aucune ambiguïté","Comme un châtiment décidé par Charles","Comme un refuge spirituel et une paix retrouvée, tout en interrogeant le retrait d'une société qui ne lui a pas fait de place","Comme un événement sans rapport avec la religion"],2,"Ourika affirme avoir trouvé le repos dans la foi ; le lecteur peut aussi réfléchir à ce que signifie une issue qui passe par le retrait du monde.","Entretien avec le prêtre, entrée au couvent.","Une autre lecture peut insister davantage sur la conversion et la paix intérieure, à condition de l'appuyer sur le texte."],
["app","exp","INT,NUA","Quand la marquise attribue toute la souffrance d'Ourika à son amour pour Charles, que faut-il faire ?",["Prendre cette parole pour la vérité absolue de l'autrice","La traiter comme une hypothèse avancée par un personnage, qui peut éclairer une dimension de la souffrance tout en occultant l'exclusion sociale","En déduire que la couleur n'a aucun rôle","Ne pas étudier ce dialogue"],1,"Ourika affirmait que sa position et sa couleur étaient son mal. La marquise lui impose une autre explication : le passage soulève aussi la question de qui peut définir la douleur d'autrui.","Seconde conversation avec la marquise.","On peut articuler les deux dimensions plutôt que de les opposer mécaniquement."],
["app","exp","INT,REL,NUA","Comment lire le passage sur les événements de Saint-Domingue ?",["Comme un compte rendu historiquement impartial","Comme un passage qui témoigne à la fois de la difficulté d'Ourika à se reconnaître un groupe et de représentations historiquement situées","Comme un passage sur la guerre de 1870","Comme une preuve que le roman ne traite pas de l'esclavage"],1,"Les jugements sur les insurgés doivent être replacés dans le contexte des discours de l'époque ; ils ne dispensent pas d'une lecture critique.","Réflexions sur la liberté des Noirs et Saint-Domingue.","Contextualiser signifie comprendre la situation historique du texte, non adopter ses préjugés."],
["app","av","REL,INT","Quel rapprochement peut-on faire entre Zilia et Ourika dans leur découverte de la société française ?",["Elles arrivent toutes deux de l'étranger à l'âge adulte","Zilia découvre les usages français depuis l'extérieur, tandis qu'Ourika découvre son exclusion dans le milieu français où elle a grandi","Elles refusent toutes deux l'apprentissage du français","Elles partagent exactement la même histoire"],1,"Zilia observe les usages français en étrangère venue du Pérou ; Ourika, élevée en France, découvre derrière le paravent que ce monde ne lui reconnaît pas pleinement une place. Il faut comparer cette découverte et distinguer les deux trajectoires.","Graffigny : lettres sur les mœurs françaises ; Duras : scène du paravent.","La découverte de Zilia est d'abord culturelle ; celle d'Ourika révèle une exclusion dans son propre milieu."],
["app","av","REL,INT","Quel rapprochement peut-on faire entre le bal de la Comba et la lettre 30 des Lettres persanes ?",["Ils racontent tous deux un mariage impossible","Le regard admiratif transforme parfois une personne en spectacle à cause de son origine ou de son apparence","Les personnages quittent la France après un bal","Ils condamnent toute curiosité envers les autres"],1,"Rica est observé à cause de son costume persan ; Ourika incarne l'Afrique au bal et suscite l'admiration. Dans les deux textes, le regard des autres risque de réduire une personne à une image.","Duras : bal de la Comba ; Montesquieu : lettre 30, costume de Rica.","Rica raconte cette situation avec ironie ; l'expérience d'Ourika devient douloureuse après la révélation du paravent."],
["app","av","REL,INT","Comment comparer l'éducation d'Ourika et la critique de l'éducation féminine par Zilia dans la lettre 34 ?",["Elles suivent exactement le même enseignement au couvent","Graffigny critique une éducation féminine centrée sur les apparences ; Ourika reçoit une instruction brillante qui ne lui garantit pourtant pas l'égalité sociale","Les deux textes refusent l'instruction des filles","L'éducation est absente des deux histoires"],1,"La lettre 34 critique les limites de la formation des jeunes filles nobles ; Ourika reçoit une éducation de qualité, mais se heurte aux préjugés. L'instruction et la liberté sociale ne sont pas la même chose.","Graffigny : lettre 34 ; Duras : enfance chez Mme de B. et scène du paravent.","L'éducation insuffisante de certaines jeunes filles et l'éducation brillante d'Ourika ne sont pas des situations identiques."],
["app","av","REL,INT","Quelle différence essentielle oppose les dénouements des Lettres d'une Péruvienne et d'Ourika ?",["Les deux héroïnes épousent leur ami d'enfance","Zilia choisit l'indépendance hors du mariage tandis qu'Ourika trouve un apaisement dans la vie religieuse","Les deux héroïnes retournent dans leur pays d'origine","Aucune des deux ne prend de décision"],1,"Zilia refuse d'épouser Déterville et propose une amitié ; Ourika choisit le couvent. Les deux fins interrogent la place et les possibilités offertes aux femmes, sans conduire à la même forme de vie.","Graffigny : dernières lettres ; Duras : décision d'entrer au couvent.","Il faut prendre au sérieux la paix religieuse trouvée par Ourika et ne pas la réduire à un échec."],
["app","av","REL,INT","Comment éclairer la scène du paravent grâce à la notion d'ethnocentrisme étudiée avec Alain Testart ?",["Elle prouve que les normes de l'aristocratie sont naturelles","Elle montre comment un groupe juge autrui selon ses propres normes, qu'il considère à tort comme évidentes","Elle montre qu'Ourika rejette toute culture étrangère","Elle ne concerne que l'amour de Charles"],1,"Testart définit la tendance à juger les autres à partir de sa propre culture. Derrière le paravent, Ourika entend des jugements fondés sur des normes tenues pour évidentes. Ce rapprochement n'efface pas la dimension proprement raciale et sociale de l'exclusion.","Duras : paravent ; Alain Testart : texte sur l'ethnocentrisme.","L'ethnocentrisme n'explique pas à lui seul les préjugés raciaux et les contraintes matrimoniales."],
["dia","ess","DIA,ILL","Examinateur : « Quel passage vous semble décisif ? »",["« Le paravent, parce qu'Ourika y comprend brutalement la place que la société lui réserve ; cela change tout son regard sur elle-même. »","« Le début, parce que c'est le début. »","« Tous les passages sont pareils. »","« Je ne sais pas. »"],0,"La réponse doit plutôt identifier un passage précis et expliquer son rôle dans le roman.","Scène du paravent.","Ce n'est pas un modèle à mémoriser : un autre passage, précisément justifié, serait recevable."],
["dia","ess","DIA,NUA","Examinateur : « Mais Ourika est aimée : pourquoi parle-t-elle de solitude ? »",["« C'est faux : personne ne l'aime. »","« Elle est effectivement aimée, mais elle distingue l'affection privée d'une véritable place dans le monde social. »","« Elle vit seule dès l'enfance. »","« La solitude n'est qu'une question de distance. »"],1,"On attend ici que tu reconnaisses la valeur de l'objection, puis que tu introduises une distinction pour approfondir ta réponse.","Affection de Mme de B. et refrain de la solitude.","D'autres exemples de la vie d'Ourika permettraient également de défendre cette lecture."],
["dia","av","DIA,NUA","Examinateur : « Peut-on qualifier ce roman d'antiraciste ? »",["« Oui, au sens exact d'aujourd'hui. »","« Non, sans discussion possible. »","« Le roman donne une place centrale à l'exclusion raciale et critique les préjugés ; mais le terme doit être expliqué et le texte situé historiquement. »","« Il ne s'agit que d'un roman sentimental. »"],2,"On attend ici que tu distingues la portée critique du roman et le risque d'anachronisme.","Paravent, regard social, contexte de Saint-Domingue.","Il existe d'autres formulations recevables, pourvu qu'elles soient précises et argumentées."],
["dia","av","DIA,ILL","Examinateur : « La religion sauve-t-elle Ourika ? »",["« Le texte la présente comme un apaisement réel ; mais on peut aussi s'interroger sur le retrait du monde social qui accompagne cette issue. »","« Elle supprime tous les préjugés de la société. »","« La religion n'apparaît pas dans le roman. »","« On ne peut pas répondre. »"],0,"On attend ici que tu reconnaisses la place de la conversion dans le récit, tout en laissant la possibilité de discuter le dénouement.","Entretien avec le prêtre et dénouement.","On peut également privilégier la dimension spirituelle du dénouement, avec des exemples précis."],
["dia","exp","DIA,JUS,NUA","Examinateur : « Ourika n'est-elle pas en partie responsable de son malheur ? »",["« Absolument, elle imagine tout. »","« Non, seuls les autres sont responsables et sa vie intérieure ne compte pas. »","« Elle reconnaît parfois entretenir sa douleur ; mais ce mal intérieur se développe à partir d'une exclusion socialement construite. Il faut penser les deux dimensions ensemble. »","« Charles est responsable de tous ses problèmes. »"],2,"On attend une réponse qui n'attribue pas toute la souffrance à une faute personnelle, mais qui n'efface pas non plus la complexité psychologique d'Ourika.","Paravent, maladie, seconde conversation avec la marquise.","La question admet d'autres nuances ; on attend une justification fidèle au texte."],
["dia","av","REL,INT","Examinateur : « Vous avez étudié Montaigne. Quel lien voyez-vous entre sa réflexion sur la barbarie et Ourika ? »",["« Montaigne critique le fait de juger autrui selon ses coutumes ; dans Ourika, le milieu aristocratique impose aussi ses propres normes, mais dans une situation historique différente. »","« Les deux textes racontent la même conquête. »","« Le mot barbare désigne une infériorité naturelle. »","« Il n'existe aucun lien entre ces textes. »"],0,"On attend une comparaison argumentée : Montaigne interroge le mot « barbare » et critique le jugement selon nos coutumes. Le paravent révèle à Ourika que son entourage juge aussi selon des normes propres à son milieu.","Montaigne : Essais, « Des cannibales » ; Duras : scène du paravent.","Citer Montaigne ne suffit pas : il faut expliquer la relation et aussi les différences."],
["dia","av","REL,INT","Examinateur : « En quoi Ourika correspond-il au parcours “Un nouvel univers s'est offert à mes yeux” ? »",["« Parce qu'elle fait le tour du monde. »","« Parce qu'elle découvre derrière le paravent les préjugés d'un monde social qu'elle croyait connaître : le nouvel univers est aussi intérieur. »","« Parce que toutes les œuvres racontent le même voyage. »","« Parce qu'un nouvel univers ne peut être qu'un autre pays. »"],1,"On attend une interprétation étayée de la découverte : Ourika prend conscience des normes de la société où elle a grandi. Ce nouvel univers social fait écho à la découverte de la France par Zilia, sans se confondre avec elle.","Duras : scène du paravent ; Graffigny : parcours « Un nouvel univers s'est offert à mes yeux ».","Un autre passage pourrait aussi convenir, à condition de montrer ce qu'Ourika découvre réellement."],
["choix","ess","JUS,REO","Quelle raison personnelle pourrais-tu donner pour expliquer ton choix d’Ourika à l’oral ?",["« Ce roman m'a interrogé sur la façon dont le regard d'autrui peut transformer l'image de soi. »","« Tous les lecteurs doivent être émus par le même passage. »","« Je dois répéter l'avis du professeur. »","« Une œuvre ne doit jamais provoquer de questions. »"],0,"On attend une raison de choix personnelle, reliée à une expérience précise d'Ourika, qui pourrait ensuite nourrir un échange sur le monde d'aujourd'hui.","Après le paravent : miroir, corps et regard.","Une autre réaction ou un autre thème peut tout aussi bien fonder ton choix."],
["choix","av","JUS,ILL","Tu dis : « J'aime que le roman soit plus complexe qu'une simple histoire d'amour. » Comment le justifier ?",["« Parce qu'il est difficile à lire. »","« La douleur d'Ourika concerne à la fois la couleur, la société, les liens familiaux, Charles et la religion. »","« Parce qu'il n'y a pas d'histoire. »","« Parce que tout est contradictoire. »"],1,"On attend une justification qui s'appuie sur plusieurs enjeux réellement présents dans le roman.","Ensemble du récit.","N'adopte pas cette raison si elle ne correspond pas à ton expérience de lecture."],
["choix","av","REO,REL","Comment faire un rapprochement avec le monde actuel ?",["Dire que notre époque est absolument identique","Évoquer avec prudence des questions d'appartenance ou de discrimination, puis revenir à une scène précise du roman","Remplacer le roman par un débat sans lien avec lui","Dire que Duras prédit exactement notre monde"],1,"On attend un rapprochement mesuré avec le monde actuel, qui respecte la distance historique et s'appuie sur le texte.","Scènes du regard social et de la solitude.","Une résonance avec le présent n'est jamais obligatoire pour défendre le choix d'une œuvre."],
["choix","exp","PRE,JUS,NUA","Quelle présentation d’Ourika permet de situer l’œuvre et d’ouvrir un véritable entretien ?",["« Ourika est un roman très intéressant ; je vais d'abord raconter tous les événements de l'histoire. »","« Ourika, de Claire de Duras, paraît en 1823, au début du XIXe siècle, sous la Restauration. Le récit suit une jeune Sénégalaise élevée dans l'aristocratie française qui découvre les préjugés dont elle est victime. Ce qui m'a particulièrement intéressé, c'est… »","« Claire de Duras est née en 1777 ; je vais surtout raconter sa biographie. »","« J'ai apprécié le livre, mais je n'ai pas besoin de le présenter ni de justifier mon choix. »"],1,"On attend une présentation brève qui indique le titre, l'autrice, la date de publication (1823), le début du XIXe siècle et le sujet du roman, avant d'expliquer un intérêt personnel avec un exemple précis. Inutile de raconter toute l'intrigue.","Présentation d'Ourika et ouverture de l'entretien.","Ce n'est pas un discours à apprendre mot à mot. Les repères permettent de situer l'œuvre ; le choix d'un passage et la justification personnelle appartiennent à chaque lecteur."],
["choix","av","REL,INT","Examinateur : « Votre lecture d'Ourika a-t-elle changé votre regard sur Lettres d'une Péruvienne ? » Quelle réponse est la mieux argumentée ?",["« Les deux livres racontent exactement la même chose parce qu'ils ont deux héroïnes. »","« Ourika m'a montré que l'éducation ne suffit pas toujours à supprimer l'exclusion ; je comprends autrement l'indépendance choisie par Zilia. Je peux citer le paravent et la fin du roman de Graffigny. »","« Les textes vus en classe n'ont aucun intérêt ici. »","« Il faut avoir préféré Ourika à Graffigny. »"],1,"On attend une réponse personnelle qui s'appuie sur des scènes précises des deux œuvres et explique ce que la comparaison change dans la lecture.","Duras : paravent et couvent ; Graffigny : lettre 34 et dénouement.","Une réponse négative ou un autre point de vue seraient recevables s'ils sont personnels et argumentés."]

// Contextualisations brèves des notions historiques et sociales sensibles.
const CONTEXTE={
  "2": "Au XVIIIe siècle, la traite atlantique organise la déportation et la vente de personnes africaines réduites en esclavage. Le récit raconte qu'Ourika échappe à ce départ, mais elle est elle-même achetée : cette tension mérite d'être remarquée.",
  "3": "Dans la société aristocratique de la fin du XVIIIe siècle, recevoir une éducation brillante n'assure pas à tous le même statut ni les mêmes possibilités d'avenir.",
  "4": "Les préjugés raciaux évoqués renvoient aux hiérarchies et discriminations de cette société, non à une différence naturelle de valeur entre les personnes.",
  "6": "À cette époque, dans les milieux représentés, le mariage et la maternité sont souvent présentés comme des destinées centrales pour les femmes, sans constituer leur unique expérience possible.",
  "9": "Les principes révolutionnaires d'égalité ne signifient pas la disparition immédiate des discriminations liées à la couleur de peau ou à la position sociale.",
  "10": "La Terreur désigne notamment la période de répression politique de 1793-1794 ; le roman en propose un regard situé dans un milieu aristocratique.",
  "11": "Claire de Duras, issue de l'aristocratie, écrit dans un contexte où la publication littéraire par une femme de son rang est socialement délicate. Son premier roman paraît anonymement.",
  "12": "La date de première publication (1823) ne doit pas être confondue avec l'année des événements racontés, ni avec l'édition commerciale de 1824.",
  "13": "La Restauration correspond au retour des Bourbons après Napoléon. Le roman est écrit dans ce contexte mais revient sur la Révolution française.",
  "14": "La sensibilité romantique se développe progressivement : un roman peut mêler émotion, héritage classique et critique de la société sans appartenir exclusivement à un seul mouvement.",
  "15": "À Saint-Domingue, colonie esclavagiste française, des personnes réduites en esclavage se soulèvent à partir de 1791. Il faut replacer les jugements exprimés dans le roman dans cette histoire coloniale.",
  "16": "La violence du regard sur sa couleur relève de préjugés intériorisés sous l'effet de l'exclusion, non d'un jugement objectif sur son apparence.",
  "17": "Le rôle assigné au mariage dans cette société limite fortement les possibilités reconnues aux femmes, plus encore à une femme noire comme Ourika.",
  "18": "La formule sur les rôles de « sœur, femme, mère » reflète la place centrale accordée à la famille et au mariage dans le monde social du récit.",
  "19": "La bienveillance individuelle de Mme de B. ne supprime pas les inégalités et les préjugés propres au monde aristocratique où Ourika grandit.",
  "20": "La mise en scène d'une « Afrique » dans un divertissement mondain correspond à un regard européen de l'époque, qui ne reflète pas la diversité des cultures africaines.",
  "21": "Le choix religieux est présenté comme une issue intime ; il faut aussi le replacer dans les possibilités sociales alors ouvertes, ou fermées, à une femme dans la situation d'Ourika.",
  "22": "À cette époque, le mariage d'une femme est souvent considéré comme déterminant. La marquise interprète le chagrin d'Ourika à travers cette norme, sans lui laisser pleinement définir sa propre souffrance.",
  "23": "Saint-Domingue, colonie française fondée sur l'esclavage, connaît à partir de 1791 une insurrection majeure. Les violences se produisent dans plusieurs camps ; les jugements du personnage doivent être distingués des faits historiques.",
  "24": "Les rapports à l'origine et les hiérarchies sociales ou raciales doivent être compris dans leurs contextes distincts.",
  "25": "Le regard exotisant réduit parfois une personne à une représentation de l'ailleurs plutôt qu'à son individualité.",
  "26": "Dans ces milieux, la formation des filles est fortement liée aux attentes sociales autour du mariage et de la vie mondaine.",
  "27": "Le mariage constitue souvent un horizon central pour les femmes des milieux sociaux représentés.",
  "28": "Une norme culturelle peut être présentée comme naturelle par le groupe qui la défend ; il faut en examiner les conséquences concrètes.",
  "30": "L'affection privée peut coexister avec une exclusion sociale : la situation d'Ourika met en lumière cette contradiction propre au milieu où elle vit.",
  "31": "Le terme « antiraciste » est courant aujourd'hui, mais son sens politique actuel ne doit pas être projeté sans nuance sur une œuvre publiée en 1823.",
  "33": "L'intériorisation de la souffrance n'efface pas les discriminations qui contribuent à la provoquer. Éviter de faire porter sur la personne exclue toute la responsabilité de son malheur.",
  "34": "Chez Montaigne, « barbare » est une catégorie que des Européens appliquent aux peuples du Nouveau Monde ; son sens doit être contextualisé.",
  "35": "Le parcours est associé à une œuvre du XVIIIe siècle ; la cursive de Duras, au XIXe siècle, en prolonge certaines questions.",
  "36": "Le thème du regard d'autrui renvoie ici aux normes et préjugés d'une société historiquement déterminée.",
  "37": "Les attentes pesant sur les femmes, les hiérarchies sociales et les préjugés raciaux se croisent dans la trajectoire d'Ourika.",
  "38": "Un rapprochement avec notre époque peut être fécond, sans effacer les différences entre les sociétés du XVIIIe-XIXe siècle et aujourd'hui.",
  "39": "Le roman paraît à la fin de 1823, sous la Restauration, mais son intrigue remonte à l’Ancien Régime et à la Révolution. Pour une femme de l’aristocratie comme Claire de Duras, publier un livre reste soumis à de fortes conventions sociales ; le roman paraît d’abord anonymement.",
  "40": "Il faut respecter la différence de contexte et de destin entre les deux héroïnes."

const MODULES={con:["🧭","Connaître","Personnages, intrigue, structure, contexte."],app:["🔎","S'approprier","Passages, interprétations et nuances."],dia:["💬","Dialoguer","Questions d'examinateur et réponses argumentées."],choix:["✦","Mon choix d'œuvre","Trouver tes raisons personnelles de présenter Ourika."]};
const app=document.getElementById("app");
let module=null,pos=0,selected=[],validated=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function home(){module=null;window.scrollTo(0,0);render()}
function start(m){module=m;pos=0;selected=[];validated=false;window.scrollTo(0,0);render()}
function items(){return DATA.map((d,i)=>({d,i})).filter(x=>x.d[0]===module)}
function pick(i){if(validated)return;selected=[i];render()}
function correct(){return selected[0]===items()[pos].d[5]}
function validate(){if(!selected.length||validated)return;validated=true;render()}
function next(){if(pos+1>=items().length){pos=items().length;render();return}pos++;selected=[];validated=false;render()}
function render(){
if(!module){
app.innerHTML='<section class="hero"><div class="eyebrow">Lecture cursive · Préparation à l’entretien de l&#39;oral du bac français</div><h2>Connaître, s’approprier, dialoguer</h2><p>Les activités t’aideront à mieux connaître le roman, à choisir des exemples précis et à préparer une lecture personnelle.</p><div class="principle">Une interprétation n’est pas une réponse à apprendre. Plusieurs lectures peuvent être défendues si elles respectent le texte et sont argumentées.</div></section><section class="modules">'+Object.entries(MODULES).map(([k,m])=>'<button class="module" data-module="'+k+'"><span class="sym">'+m[0]+'</span><strong>'+esc(m[1])+'</strong><span>'+esc(m[2])+'</span></button>').join('')+'</section>';
app.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>start(b.dataset.module));return}
const its=items();if(pos>=its.length){app.innerHTML='<section class="result"><div class="eyebrow">Activité terminée</div><h2>'+esc(MODULES[module][1])+'</h2><p>Tu as terminé les questions de cette activité. Tu peux revoir les passages cités dans les corrections, puis reprendre les questions librement.</p><button class="button" id="return">Retour aux activités</button></section>';document.getElementById("return").onclick=home;return}
const d=its[pos].d, ok=validated?correct():null, interpr=module!=="con", contexte=CONTEXTE[its[pos].i+1];const ref=d[7], nuance=d[8]||"Cette réponse est une piste possible mais pas une formulation obligatoire. D'autres lectures argumentées peuvent être recevables.";
app.innerHTML='<div class="top"><button class="backbtn" id="return">← Activités</button><span class="small">'+esc(MODULES[module][1])+' · '+(pos+1)+' / '+its.length+'</span></div><section class="question">'+(module==="dia"?'<div class="challenge"><strong>Mode défi</strong>Avant de regarder les propositions, imagine ce que tu pourrais répondre. Les choix servent ensuite à comparer des stratégies d’argumentation.</div>':'')+'<h2>'+esc(d[3])+'</h2><div class="choices">'+d[4].map((v,i)=>'<button data-choice="'+i+'" class="'+(validated&&i===d[5]?'good':validated&&selected[0]===i?'wrong':selected[0]===i?'picked':'')+'" '+(validated?'disabled':'')+'>'+esc(v)+'</button>').join('')+'</div>'+(validated?'<div class="feedback"><strong>'+(ok?'✓ Bonne réponse':'À reprendre')+'</strong>'+esc(d[6])+(interpr?'<div class="nuance">'+esc(nuance)+'</div>':'')+(contexte?'<div class="nuance"><strong>Repère de contexte historique</strong><div>'+esc(contexte)+'</div></div>':'')+'<div class="ref">Repère textuel : '+esc(ref)+'</div></div>':'')+'<div class="action"><button class="button" id="action" '+(!validated&&!selected.length?'disabled':'')+'>'+(validated?(pos+1===its.length?'Terminer l’activité':'Question suivante →'):'Valider ma réponse')+'</button></div></section>';
document.getElementById("return").onclick=home;
app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>pick(Number(b.dataset.choice)));
document.getElementById("action").onclick=validated?next:validate;
}
render();
</script></body></html>
