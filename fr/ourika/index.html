.small{font-size:14px;color:var(--muted)}.levels{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.levels button{border:1px solid #daddd9;background:white;border-radius:30px;padding:10px 17px;color:var(--ink);font-size:15px;font-weight:700}.levels button.active{background:var(--green);border-color:var(--green);color:white}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.backbtn{border:0;background:transparent;color:var(--green);font-weight:800;padding:8px 0}.bar{height:8px;background:#e9efec;border-radius:10px;overflow:hidden;margin:20px 0}.bar div{height:100%;background:var(--green);transition:width .2s}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tag{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;padding:5px 9px;border-radius:7px;color:#35685b;background:#eaf4ef}.question h2{font-size:23px;line-height:1.42;margin:0 0 22px}.choices{display:grid;gap:11px}.choices button{font:inherit;text-align:left;border:1px solid #dcdedc;background:#fdfdfc;padding:15px 17px;border-radius:12px;line-height:1.55;min-height:55px}.choices button.picked{background:#e7f3ee;border-color:#4e9b81}.choices button.good{background:#e4f8ea;border-color:#65ae7f}.choices button.wrong{background:#fff1ef;border-color:#d79c93}.choices button:disabled{color:inherit;opacity:1}.button{border:0;background:var(--green);color:white;padding:13px 20px;border-radius:30px;font-size:16px;font-weight:800;cursor:pointer}.button:disabled{opacity:.45;cursor:default}.action{margin-top:20px;display:flex;justify-content:flex-end}.feedback{padding:19px;margin-top:21px;border-radius:13px;background:#f3f8f5;border:1px solid #d8e9e0;font-size:16px;line-height:1.7}.feedback strong{display:block;margin-bottom:9px}.feedback .nuance{margin-top:14px;padding:12px;background:#fffdfa;border-left:3px solid #ac8e61}.ref{font-size:14px;color:#5e6469;margin-top:13px}.challenge{border:1px dashed #b5beae;border-radius:12px;padding:15px;background:#f8faf7;margin-bottom:20px}.challenge strong{display:block}.footer{border-top:1px solid var(--border);margin-top:35px;padding-top:20px;font-size:13px;color:var(--muted);display:flex;gap:15px;justify-content:space-between}.footer button{background:none;border:0;text-decoration:underline;color:var(--muted)}.result h2{font-size:26px}.result p{color:var(--muted)}.list{padding-left:20px}

<body><main class="shell"><a class="back" href="../">← Toutes les révisions de français</a><header class="heading"><div><div class="eyebrow">Français · 1re ST2S · EAF 2027</div><h1>Ourika</h1><p>Claire de Duras · Lecture cursive · V1.0</p></div><span class="mark">O</span></header><div id="app"></div><footer class="footer"><span>Révision libre · Aucun résultat enregistré · Aucune saisie écrite ni enregistrement vocal</span></footer></main>
<script>
"use strict";
const DATA=[
["con","ess","CON","Comment le lecteur découvre-t-il l'histoire d'Ourika ?",["Par des lettres qu'Ourika adresse à Charles.","Par les souvenirs que Mme de B. confie à un ami.","Par le récit qu'Ourika fait à un médecin.","Par un journal retrouvé après la mort d'Ourika."],2,"Le médecin raconte sa rencontre avec Ourika puis lui laisse la parole. Cette construction est un récit enchâssé.","Ouverture : rencontre au couvent, puis récit d'Ourika."],
["con","ess","CON","D'où vient Ourika ?",["Du Sénégal, en Afrique de l'Ouest.","De Saint-Domingue, dans les Caraïbes.","Du Pérou, en Amérique du Sud.","De la Martinique, dans les Antilles."],0,"Le chevalier de B. achète Ourika alors qu'elle allait être embarquée sur un navire négrier, c'est-à-dire un bateau utilisé pour transporter de force des personnes réduites en esclavage dans le cadre de la traite esclavagiste. Il la rapporte du Sénégal en France à l'âge de deux ans.","Début du récit d'Ourika : arrivée en France."],
["con","ess","CON","Qui accueille et élève Ourika ?",["La marquise de Thémines.","La mère de Charles.","Une religieuse ursuline.","Madame de B."],3,"Mme de B. élève Ourika dans son salon aristocratique, avec beaucoup d'affection et une excellente éducation.","Enfance auprès de Mme de B."],
["con","ess","CON","Quelle scène brise l'insouciance d'Ourika ?",["Le bal où elle représente l'Afrique devant les invités.","La conversation qu'elle entend derrière un paravent.","L'annonce du mariage de Charles avec Anaïs.","Une discussion avec le prêtre sur son avenir."],1,"Ourika entend Mme de B. et la marquise s'inquiéter de son avenir et évoquer l'impossibilité de son mariage en raison des préjugés raciaux. Elle comprend soudain la place que la société lui assigne.","Conversation derrière le paravent."],
["con","ess","CON","Quel lien unit Charles et Ourika pendant l'enfance ?",["Ils sont cousins et appartiennent à la même famille.","Ils se rencontrent tardivement et deviennent confidents.","Ils grandissent ensemble et nouent une profonde amitié.","Ils sont promis l'un à l'autre dès leur enfance."],2,"Charles est le petit-fils de Mme de B. et le compagnon d'enfance d'Ourika. La nature du sentiment d'Ourika pour lui devient ensuite un enjeu d'interprétation.","Enfance et retrouvailles avec Charles."],
["con","ess","CON","Qui Charles épouse-t-il ?",["Anaïs de Thémines.","Une amie d'Ourika.","La fille de la marquise.","Une jeune aristocrate italienne."],0,"Charles épouse Anaïs de Thémines. Leur bonheur conjugal, puis la naissance de leur enfant, renforcent la solitude ressentie par Ourika.","Mariage de Charles et naissance de son fils."],
["con","ess","CON","Comment se termine l'histoire ?",["Ourika retrouve ses origines et quitte la France.","Ourika se réconcilie avec Charles et fonde une famille.","Ourika retrouve Mme de B. et revient vivre auprès d'elle.","Ourika entre au couvent et y meurt quelque temps après."],3,"Ourika trouve un apaisement dans la religion et choisit la vie conventuelle. Le médecin rapporte qu'elle meurt à la fin d'octobre.","Dénouement et dernière phrase du récit."],
["con","ess","CON","Quel sentiment traverse le roman comme un refrain ?",["La nostalgie d'une enfance heureuse.","La souffrance d'être seule et exclue.","Le désir de découvrir ses origines.","La peur de perdre son rang social."],1,"« Seule, pour toujours seule » : la répétition signale l'obsession d'une vie privée de liens pleinement reconnus.","Après la scène du paravent."],
["con","av","CON","Quel espoir la Révolution inspire-t-elle un temps à Ourika ?",["Que la monarchie protège davantage les jeunes filles.","Que la société rétablisse les anciennes traditions familiales.","Que les bouleversements sociaux fassent reculer les préjugés.","Que Charles abandonne ses obligations pour partir avec elle."],2,"Ourika imagine que les bouleversements sociaux pourraient diminuer son exclusion. Cet espoir est rapidement déçu.","Réflexions d'Ourika sur la Révolution."],
["con","av","CON","Pourquoi la fin de la Terreur ne signifie-t-elle pas simplement le bonheur pour Ourika ?",["La vie mondaine reprend avec les préjugés qui l'excluent.","Les troubles révolutionnaires l'obligent à quitter Mme de B.","Le retour de la monarchie interdit désormais son éducation.","Les événements politiques mettent définitivement fin à son amitié."],0,"Pendant la Terreur, les malheurs partagés avaient atténué son sentiment d'exclusion ; le retour de la société mondaine réactive ce sentiment.","Après la fin de la Terreur."],
["con","ess","CON","Qui a écrit Ourika ?",["Madame de Staël.","Françoise de Graffigny.","George Sand.","Claire de Duras."],3,"Claire de Duras (1777-1828) est une écrivaine française issue de l'aristocratie. Elle tient à Paris un salon littéraire et politique influent sous la Restauration.","Présentation de Claire de Duras ; contexte de publication."],
["con","ess","CON","En quelle année Ourika paraît-il pour la première fois ?",["1747","1823","1789","1848"],1,"Le roman paraît d'abord anonymement, à la fin de 1823, en très petit tirage. Une édition destinée à la vente paraît chez Ladvocat en mars 1824. Distingue la première publication et l'édition commerciale.","Première publication (1823) et édition Ladvocat (1824)."],
["con","av","CON","À quel siècle rattacher Ourika et comment situer sa publication ?",["Au XVIIIe siècle, pendant le règne de Louis XVI.","Au XIXe siècle, pendant le Second Empire.","Au XIXe siècle, pendant la Restauration.","Au XVIIIe siècle, pendant la Révolution française."],2,"Ourika est publié au début du XIXe siècle, sous la Restauration (1814-1830). Son intrigue revient en arrière sur les dernières années de l'Ancien Régime et la Révolution française.","Contexte de publication et épisodes révolutionnaires du récit."],
["con","av","CON","À quelle sensibilité littéraire peut-on rapprocher Ourika ?",["Au roman sentimental, à l'époque de l'essor du romantisme.","Au roman des Lumières, fondé principalement sur la satire.","Au réalisme, fondé principalement sur la description sociale.","Au classicisme, fondé principalement sur les règles théâtrales."],0,"Ourika explore la solitude et la souffrance intérieure. Il paraît au moment où se développe le romantisme français, mais hérite aussi du roman sentimental et de la sobriété d'écriture classique. Évite de le réduire à une seule étiquette.","Roman sentimental, sensibilité romantique, héritage classique."],
["con","av","CON","Quels bouleversements historiques traversent l'histoire racontée par Ourika ?",["Les guerres napoléoniennes et la chute de l'Empire.","La révolution de 1848 et l'abolition de l'esclavage.","La révolution de Juillet et l'avènement de Louis-Philippe.","La Révolution française, la Terreur et Saint-Domingue."],3,"Le destin intime d'Ourika se déroule sur fond de Révolution française, de Terreur et de révolte à Saint-Domingue. Ces événements bouleversent les hiérarchies de naissance, de couleur et de statut sans effacer les préjugés.","Passages sur la Révolution, la Terreur et Saint-Domingue."],
["app","ess","INT,ILL","Quelle scène soutient le mieux l'idée que le regard social change l'image qu'Ourika a d'elle-même ?",["Après le paravent, elle intériorise l'image dévalorisante que la société lui renvoie.","Pendant le bal, elle découvre qu'elle peut plaire aux invités.","Pendant son enfance, elle apprend les arts et les langues.","Au couvent, elle reçoit la visite d'un médecin inquiet."],0,"Le regard des autres est intériorisé : après avoir entendu les préjugés de son entourage, Ourika se juge elle-même à travers eux.","Après le paravent : miroir, mains, vêtements."],
["app","ess","INT,NUA","« Ourika souffre uniquement parce qu'elle aime Charles » : quelle réponse est la plus convaincante ?",["Son amour pour Charles explique principalement son malheur dès l'enfance.","Sa souffrance commence avec le mariage de Charles et d'Anaïs.","Son sentiment pour Charles ne joue aucun rôle dans son malheur.","Son exclusion sociale précède la révélation de son amour possible."],3,"La chronologie du texte empêche de réduire toute la douleur à une passion amoureuse. La question de l'amour peut cependant enrichir l'analyse.","Scène du paravent, puis seconde conversation avec la marquise.","Une autre interprétation peut donner une place importante à l'amour, à condition de tenir compte de l'exclusion déjà vécue."],
["app","ess","INT,ILL","Quel passage permet d'évoquer le désir d'Ourika de vivre des liens familiaux ?",["Elle évoque les arts et les connaissances transmis par Mme de B.","Elle déplore de ne pouvoir être sœur, épouse ou mère.","Elle se souvient du bonheur éprouvé au bal de la Comba.","Elle raconte les discussions politiques pendant la Révolution."],1,"La formule exprime la force des normes familiales et le sentiment d'en être exclue.","Réflexions sur la famille et l'isolement."],
["app","av","INT,NUA","Comment comprendre le rôle de Mme de B. ?",["Elle protège Ourika, tout en l'empêchant volontairement de se marier.","Elle instruit Ourika sans jamais lui témoigner d'affection véritable.","Elle aime Ourika, sans pouvoir lui assurer une place dans la société.","Elle comprend parfaitement l'exclusion d'Ourika et parvient à la résoudre."],2,"La bonté de Mme de B. et les conséquences douloureuses de son projet éducatif coexistent. Cette contradiction rend le personnage complexe.","Éducation, conversation du paravent, derniers échanges.","Il ne s'agit pas de désigner un coupable unique : plusieurs responsabilités et contradictions peuvent être analysées."],
["app","av","INT,NUA","Le bal de la Comba est-il une scène heureuse ou une scène d'exclusion ?",["Un bonheur réel, que la suite du récit rend rétrospectivement ambigu.","Une humiliation immédiate, dont Ourika mesure déjà toute la violence.","Un divertissement mondain, sans conséquence sur la suite du récit.","Une victoire sociale qui lui garantit désormais une place reconnue."],0,"Ourika éprouve alors un plaisir réel, mais le récit rétrospectif invite à interroger son rôle de spectacle représentant l'Afrique.","Bal puis conversation du paravent.","La nuance importe : la relecture critique ne doit pas effacer le bonheur effectivement ressenti sur le moment."],
["app","av","INT,NUA","Comment envisager l'entrée d'Ourika au couvent ?",["Une défaite qui prouve qu'elle n'éprouve aucune conviction religieuse.","Une liberté nouvelle qui résout définitivement son exclusion sociale.","Une décision destinée avant tout à faire regretter Charles.","Un refuge spirituel, qui peut aussi être vu comme un retrait du monde."],3,"Ourika affirme avoir trouvé le repos dans la foi ; le lecteur peut aussi réfléchir à ce que signifie une issue qui passe par le retrait du monde.","Entretien avec le prêtre, entrée au couvent.","Une autre lecture peut insister davantage sur la conversion et la paix intérieure, à condition de l'appuyer sur le texte."],
["app","exp","INT,NUA","Quand la marquise attribue toute la souffrance d'Ourika à son amour pour Charles, que faut-il faire ?",["Accepter son analyse, car elle connaît mieux Ourika qu'elle-même.","Examiner son hypothèse sans effacer la souffrance liée à l'exclusion.","Rejeter son analyse, car Charles est absent de toute cette souffrance.","Retenir son explication, qui révèle le seul véritable sujet du roman."],1,"Ourika affirmait que sa position et sa couleur étaient son mal. La marquise lui impose une autre explication : le passage soulève aussi la question de qui peut définir la douleur d'autrui.","Seconde conversation avec la marquise.","On peut articuler les deux dimensions plutôt que de les opposer mécaniquement."],
["app","exp","INT,REL,NUA","Comment lire le passage sur les événements de Saint-Domingue ?",["Comme un témoignage historique indépendant des préjugés de l'époque.","Comme une condamnation complète de toute forme de révolte politique.","Comme un regard marqué par les représentations et tensions de son époque.","Comme une preuve qu'Ourika connaît parfaitement la société africaine."],2,"Les jugements sur les insurgés doivent être replacés dans le contexte des discours de l'époque ; ils ne dispensent pas d'une lecture critique.","Réflexions sur la liberté des Noirs et Saint-Domingue.","Contextualiser signifie comprendre la situation historique du texte, non adopter ses préjugés."],
["app","av","REL,INT","Quel rapprochement peut-on faire entre Zilia et Ourika dans leur découverte de la société française ?",["Zilia découvre la France de l'extérieur ; Ourika découvre son exclusion de l'intérieur.","Zilia découvre les préjugés religieux ; Ourika découvre seulement les inégalités économiques.","Zilia critique les Français dès son enfance ; Ourika les découvre à l'âge adulte.","Zilia cherche à quitter son milieu ; Ourika cherche surtout à retrouver le Pérou."],0,"Zilia observe les usages français en étrangère venue du Pérou ; Ourika, élevée en France, découvre derrière le paravent que ce monde ne lui reconnaît pas pleinement une place. Il faut comparer cette découverte et distinguer les deux trajectoires.","Graffigny : lettres sur les mœurs françaises ; Duras : scène du paravent.","La découverte de Zilia est d'abord culturelle ; celle d'Ourika révèle une exclusion dans son propre milieu."],
["app","av","REL,INT","Quel rapprochement peut-on faire entre le bal de la Comba et la lettre 30 des Lettres persanes ?",["Les deux personnages utilisent leur apparence pour échapper au regard social.","Les deux personnages cherchent à obtenir l'admiration des Parisiens.","Les deux textes montrent une société capable d'accueillir tous les étrangers.","Les deux scènes montrent une curiosité qui peut réduire l'autre à son apparence."],3,"Rica est observé à cause de son costume persan ; Ourika incarne l'Afrique au bal et suscite l'admiration. Dans les deux textes, le regard des autres risque de réduire une personne à une image.","Duras : bal de la Comba ; Montesquieu : lettre 30, costume de Rica.","Rica raconte cette situation avec ironie ; l'expérience d'Ourika devient douloureuse après la révélation du paravent."],
["app","av","REL,INT","Comment comparer l'éducation d'Ourika et la critique de l'éducation féminine par Zilia dans la lettre 34 ?",["Les deux héroïnes montrent qu'une bonne instruction assure l'indépendance des femmes.","Zilia critique une éducation insuffisante ; Ourika montre les limites sociales de l'instruction.","Les deux romans montrent que l'éducation religieuse empêche toute liberté personnelle.","Zilia défend l'éducation mondaine ; Ourika rejette les savoirs qu'elle a reçus."],1,"La lettre 34 critique les limites de la formation des jeunes filles nobles ; Ourika reçoit une éducation de qualité, mais se heurte aux préjugés. L'instruction et la liberté sociale ne sont pas la même chose.","Graffigny : lettre 34 ; Duras : enfance chez Mme de B. et scène du paravent.","L'éducation insuffisante de certaines jeunes filles et l'éducation brillante d'Ourika ne sont pas des situations identiques."],
["app","av","REL,INT","Quelle différence essentielle oppose les dénouements des Lettres d'une Péruvienne et d'Ourika ?",["Zilia renonce à toute relation ; Ourika rejoint finalement Charles.","Zilia accepte le mariage ; Ourika refuse toute forme d'attachement.","Zilia choisit l'indépendance ; Ourika trouve la paix dans la religion.","Zilia retrouve son pays ; Ourika choisit de retourner au Sénégal."],2,"Zilia refuse d'épouser Déterville et propose une amitié ; Ourika choisit le couvent. Les deux fins interrogent la place et les possibilités offertes aux femmes, sans conduire à la même forme de vie.","Graffigny : dernières lettres ; Duras : décision d'entrer au couvent.","Il faut prendre au sérieux la paix religieuse trouvée par Ourika et ne pas la réduire à un échec."],
["app","av","REL,INT","Comment éclairer la scène du paravent grâce à la notion d'ethnocentrisme étudiée avec Alain Testart ?",["Le groupe juge autrui selon ses propres normes, qu'il tient pour évidentes.","Le groupe reconnaît les différences culturelles sans porter de jugement.","Ourika découvre que toutes les cultures possèdent les mêmes règles sociales.","Ourika rejette ses propres habitudes pour adopter celles d'une autre société."],0,"Testart définit la tendance à juger les autres à partir de sa propre culture. Derrière le paravent, Ourika entend des jugements fondés sur des normes tenues pour évidentes. Ce rapprochement n'efface pas la dimension proprement raciale et sociale de l'exclusion.","Duras : paravent ; Alain Testart : texte sur l'ethnocentrisme.","L'ethnocentrisme n'explique pas à lui seul les préjugés raciaux et les contraintes matrimoniales."],
["dia","ess","DIA,ILL","Examinateur : « Quel passage vous semble décisif ? »",["« Le bal, car il montre le bonheur d'Ourika dans le monde aristocratique. »","« Le paravent, car il transforme durablement le regard d'Ourika sur elle-même. »","« La Révolution, car elle est le seul événement qui explique son malheur. »","« Le mariage de Charles, car il provoque immédiatement l'entrée au couvent. »"],1,"La réponse doit plutôt identifier un passage précis et expliquer son rôle dans le roman.","Scène du paravent.","Ce n'est pas un modèle à mémoriser : un autre passage, précisément justifié, serait recevable."],
["dia","ess","DIA,NUA","Examinateur : « Mais Ourika est aimée : pourquoi parle-t-elle de solitude ? »",["« Mme de B. l'aime, mais Charles finit par lui retirer toute son affection. »","« Elle est entourée, mais elle refuse progressivement toutes les marques d'amitié. »","« Elle est aimée, mais son isolement vient principalement de la vie au couvent. »","« Elle reçoit de l'affection, mais ne trouve pas de place reconnue dans la société. »"],3,"On attend ici que tu reconnaisses la valeur de l'objection, puis que tu introduises une distinction pour approfondir ta réponse.","Affection de Mme de B. et refrain de la solitude.","D'autres exemples de la vie d'Ourika permettraient également de défendre cette lecture."],
["dia","av","DIA,NUA","Examinateur : « Peut-on qualifier ce roman d'antiraciste ? »",["« Il critique les préjugés raciaux, mais doit être replacé dans son époque. »","« Il est antiraciste, car il défend exactement les valeurs de notre époque. »","« Il ne l'est pas, car les questions raciales restent secondaires dans l'intrigue. »","« Il ne l'est pas, car son héroïne finit par accepter les normes sociales. »"],0,"On attend ici que tu distingues la portée critique du roman et le risque d'anachronisme.","Paravent, regard social, contexte de Saint-Domingue.","Il existe d'autres formulations recevables, pourvu qu'elles soient précises et argumentées."],
["dia","av","DIA,ILL","Examinateur : « La religion sauve-t-elle Ourika ? »",["« Oui, car la religion permet à Ourika de retrouver sa place dans la société. »","« Non, car son entrée au couvent ne lui apporte aucun apaisement véritable. »","« Elle lui apporte la paix, mais cette issue implique aussi un retrait du monde. »","« Oui, car sa conversion lui permet de renouer ses relations avec Charles. »"],2,"On attend ici que tu reconnaisses la place de la conversion dans le récit, tout en laissant la possibilité de discuter le dénouement.","Entretien avec le prêtre et dénouement.","On peut également privilégier la dimension spirituelle du dénouement, avec des exemples précis."],
["dia","exp","DIA,JUS,NUA","Examinateur : « Ourika n'est-elle pas en partie responsable de son malheur ? »",["« Elle entretient parfois sa souffrance : son malheur vient donc surtout d'elle. »","« Elle intériorise sa souffrance, mais celle-ci naît aussi d'une exclusion sociale. »","« Elle subit des préjugés : sa vie intérieure ne joue donc aucun rôle. »","« Elle souffre de solitude : son amour pour Charles en est l'unique cause. »"],1,"On attend une réponse qui n'attribue pas toute la souffrance à une faute personnelle, mais qui n'efface pas non plus la complexité psychologique d'Ourika.","Paravent, maladie, seconde conversation avec la marquise.","La question admet d'autres nuances ; on attend une justification fidèle au texte."],
["dia","av","REL,INT","Examinateur : « Vous avez étudié Montaigne. Quel lien voyez-vous entre sa réflexion sur la barbarie et Ourika ? »",["« Montaigne critique l'ignorance des Européens ; Duras montre surtout leur supériorité culturelle. »","« Montaigne défend les peuples étrangers ; Duras refuse toute critique de la société française. »","« Montaigne parle des coutumes étrangères ; Duras décrit uniquement une histoire d'amour. »","« Montaigne interroge nos jugements culturels ; Duras montre les préjugés d'un milieu social. »"],3,"On attend une comparaison argumentée : Montaigne interroge le mot « barbare » et critique le jugement selon nos coutumes. Le paravent révèle à Ourika que son entourage juge aussi selon des normes propres à son milieu.","Montaigne : Essais, « Des cannibales » ; Duras : scène du paravent.","Citer Montaigne ne suffit pas : il faut expliquer la relation et aussi les différences."],
["dia","av","REL,INT","Examinateur : « En quoi Ourika correspond-il au parcours “Un nouvel univers s'est offert à mes yeux” ? »",["« Ourika découvre les préjugés d'un monde qu'elle croyait connaître : une révélation sociale. »","« Ourika découvre la culture africaine et retrouve progressivement les traditions de son enfance. »","« Ourika découvre la société française comme Zilia, après un voyage depuis son pays natal. »","« Ourika découvre les idées de la Révolution, qui lui apportent une place sociale stable. »"],0,"On attend une interprétation étayée de la découverte : Ourika prend conscience des normes de la société où elle a grandi. Ce nouvel univers social fait écho à la découverte de la France par Zilia, sans se confondre avec elle.","Duras : scène du paravent ; Graffigny : parcours « Un nouvel univers s'est offert à mes yeux ».","Un autre passage pourrait aussi convenir, à condition de montrer ce qu'Ourika découvre réellement."],
["choix","ess","JUS,REO","Quelle raison personnelle pourrais-tu donner pour expliquer ton choix d’Ourika à l’oral ?",["« J'ai choisi ce livre parce que les romans courts sont plus faciles à présenter. »","« J'ai choisi ce livre parce que son autrice est étudiée dans l'histoire littéraire. »","« J'ai choisi ce livre parce qu'il m'a fait réfléchir aux effets du regard d'autrui. »","« J'ai choisi ce livre parce que ses personnages appartiennent à une société différente. »"],2,"On attend une raison de choix personnelle, reliée à une expérience précise d'Ourika, qui pourrait ensuite nourrir un échange sur le monde d'aujourd'hui.","Après le paravent : miroir, corps et regard.","Une autre réaction ou un autre thème peut tout aussi bien fonder ton choix."],
["choix","av","JUS,ILL","Tu dis : « J'aime que le roman soit plus complexe qu'une simple histoire d'amour. » Comment le justifier ?",["« Le roman raconte plusieurs événements historiques qui interrompent régulièrement l'histoire d'amour. »","« La souffrance d'Ourika mêle sentiments amoureux, préjugés sociaux et quête d'identité. »","« Le roman contient de nombreux personnages qui compliquent les relations entre les protagonistes. »","« Le roman présente un amour impossible, dont toutes les autres difficultés sont des conséquences. »"],1,"On attend une justification qui s'appuie sur plusieurs enjeux réellement présents dans le roman.","Ensemble du récit.","N'adopte pas cette raison si elle ne correspond pas à ton expérience de lecture."],
["choix","av","REO,REL","Comment faire un rapprochement avec le monde actuel ?",["En montrant que les préjugés d'autrefois sont identiques aux discriminations contemporaines.","En expliquant que les progrès sociaux ont rendu les questions d'Ourika dépassées.","En utilisant le roman pour démontrer que toutes les sociétés fonctionnent de la même manière.","En reliant des questions actuelles de discrimination à une scène, sans effacer le contexte historique."],3,"On attend un rapprochement mesuré avec le monde actuel, qui respecte la distance historique et s'appuie sur le texte.","Scènes du regard social et de la solitude.","Une résonance avec le présent n'est jamais obligatoire pour défendre le choix d'une œuvre."],
["choix","exp","PRE,JUS,NUA","Quelle présentation d’Ourika permet de situer l’œuvre et d’ouvrir un véritable entretien ?",["« Claire de Duras publie Ourika en 1823, sous la Restauration. L'héroïne découvre les préjugés qui l'excluent. Ce qui m'a intéressé, c'est… »","« Claire de Duras écrit Ourika au XVIIIe siècle. Son héroïne découvre les préjugés français. Je vais commencer par raconter toute l'intrigue. »","« Claire de Duras publie Ourika en 1823. C'est un roman sur les inégalités. Je vais surtout présenter la vie de son autrice. »","« Claire de Duras publie Ourika pendant la Révolution. C'est un roman sur l'exclusion. Je vais expliquer son contexte historique en détail. »"],0,"On attend une présentation brève qui indique le titre, l'autrice, la date de publication (1823), le début du XIXe siècle et le sujet du roman, avant d'expliquer un intérêt personnel avec un exemple précis. Inutile de raconter toute l'intrigue.","Présentation d'Ourika et ouverture de l'entretien.","Ce n'est pas un discours à apprendre mot à mot. Les repères permettent de situer l'œuvre ; le choix d'un passage et la justification personnelle appartiennent à chaque lecteur."],
["choix","av","REL,INT","Examinateur : « Votre lecture d'Ourika a-t-elle changé votre regard sur Lettres d'une Péruvienne ? » Quelle réponse est la mieux argumentée ?",["« Oui, car les deux héroïnes souffrent de la société française et finissent par choisir la même forme de liberté. »","« Oui, car Ourika reçoit une éducation brillante, tandis que Zilia ne possède aucune instruction avant son arrivée en France. »","« Oui, car le destin d'Ourika m'aide à mieux comprendre l'importance de l'indépendance que Zilia choisit à la fin. »","« Oui, car les deux romans montrent que l'affection reçue permet aux héroïnes de dépasser entièrement les préjugés. »"],2,"On attend une réponse personnelle qui s'appuie sur des scènes précises des deux œuvres et explique ce que la comparaison change dans la lecture.","Duras : paravent et couvent ; Graffigny : lettre 34 et dénouement.","Une réponse négative ou un autre point de vue seraient recevables s'ils sont personnels et argumentés."]

// Contextualisations brèves des notions historiques et sociales sensibles.
const CONTEXTE={
  "2": "Au XVIIIe siècle, la traite atlantique organise la déportation et la vente de personnes africaines réduites en esclavage. Le récit raconte qu'Ourika échappe à ce départ, mais elle est elle-même achetée : cette tension mérite d'être remarquée.",
  "3": "Dans la société aristocratique de la fin du XVIIIe siècle, recevoir une éducation brillante n'assure pas à tous le même statut ni les mêmes possibilités d'avenir.",
  "4": "Les préjugés raciaux évoqués renvoient aux hiérarchies et discriminations de cette société, non à une différence naturelle de valeur entre les personnes.",
  "6": "À cette époque, dans les milieux représentés, le mariage et la maternité sont souvent présentés comme des destinées centrales pour les femmes, sans constituer leur unique expérience possible.",
  "9": "Les principes révolutionnaires d'égalité ne signifient pas la disparition immédiate des discriminations liées à la couleur de peau ou à la position sociale.",
  "10": "La Terreur désigne notamment la période de répression politique de 1793-1794 ; le roman en propose un regard situé dans un milieu aristocratique.",
  "11": "Claire de Duras, issue de l'aristocratie, écrit dans un contexte où la publication littéraire par une femme de son rang est socialement délicate. Son premier roman paraît anonymement.",
  "12": "La date de première publication (1823) ne doit pas être confondue avec l'année des événements racontés, ni avec l'édition commerciale de 1824.",
  "13": "La Restauration correspond au retour des Bourbons après Napoléon. Le roman est écrit dans ce contexte mais revient sur la Révolution française.",
  "14": "La sensibilité romantique se développe progressivement : un roman peut mêler émotion, héritage classique et critique de la société sans appartenir exclusivement à un seul mouvement.",
  "15": "À Saint-Domingue, colonie esclavagiste française, des personnes réduites en esclavage se soulèvent à partir de 1791. Il faut replacer les jugements exprimés dans le roman dans cette histoire coloniale.",
  "16": "La violence du regard sur sa couleur relève de préjugés intériorisés sous l'effet de l'exclusion, non d'un jugement objectif sur son apparence.",
  "17": "Le rôle assigné au mariage dans cette société limite fortement les possibilités reconnues aux femmes, plus encore à une femme noire comme Ourika.",
  "18": "La formule sur les rôles de « sœur, femme, mère » reflète la place centrale accordée à la famille et au mariage dans le monde social du récit.",
  "19": "La bienveillance individuelle de Mme de B. ne supprime pas les inégalités et les préjugés propres au monde aristocratique où Ourika grandit.",
  "20": "La mise en scène d'une « Afrique » dans un divertissement mondain correspond à un regard européen de l'époque, qui ne reflète pas la diversité des cultures africaines.",
  "21": "Le choix religieux est présenté comme une issue intime ; il faut aussi le replacer dans les possibilités sociales alors ouvertes, ou fermées, à une femme dans la situation d'Ourika.",
  "22": "À cette époque, le mariage d'une femme est souvent considéré comme déterminant. La marquise interprète le chagrin d'Ourika à travers cette norme, sans lui laisser pleinement définir sa propre souffrance.",
  "23": "Saint-Domingue, colonie française fondée sur l'esclavage, connaît à partir de 1791 une insurrection majeure. Les violences se produisent dans plusieurs camps ; les jugements du personnage doivent être distingués des faits historiques.",
  "24": "Les rapports à l'origine et les hiérarchies sociales ou raciales doivent être compris dans leurs contextes distincts.",
  "25": "Le regard exotisant réduit parfois une personne à une représentation de l'ailleurs plutôt qu'à son individualité.",
  "26": "Dans ces milieux, la formation des filles est fortement liée aux attentes sociales autour du mariage et de la vie mondaine.",
  "27": "Le mariage constitue souvent un horizon central pour les femmes des milieux sociaux représentés.",
  "28": "Une norme culturelle peut être présentée comme naturelle par le groupe qui la défend ; il faut en examiner les conséquences concrètes.",
  "30": "L'affection privée peut coexister avec une exclusion sociale : la situation d'Ourika met en lumière cette contradiction propre au milieu où elle vit.",
  "31": "Le terme « antiraciste » est courant aujourd'hui, mais son sens politique actuel ne doit pas être projeté sans nuance sur une œuvre publiée en 1823.",
  "33": "L'intériorisation de la souffrance n'efface pas les discriminations qui contribuent à la provoquer. Éviter de faire porter sur la personne exclue toute la responsabilité de son malheur.",
  "34": "Chez Montaigne, « barbare » est une catégorie que des Européens appliquent aux peuples du Nouveau Monde ; son sens doit être contextualisé.",
  "35": "Le parcours est associé à une œuvre du XVIIIe siècle ; la cursive de Duras, au XIXe siècle, en prolonge certaines questions.",
  "36": "Le thème du regard d'autrui renvoie ici aux normes et préjugés d'une société historiquement déterminée.",
  "37": "Les attentes pesant sur les femmes, les hiérarchies sociales et les préjugés raciaux se croisent dans la trajectoire d'Ourika.",
  "38": "Un rapprochement avec notre époque peut être fécond, sans effacer les différences entre les sociétés du XVIIIe-XIXe siècle et aujourd'hui.",
  "39": "Le roman paraît à la fin de 1823, sous la Restauration, mais son intrigue remonte à l’Ancien Régime et à la Révolution. Pour une femme de l’aristocratie comme Claire de Duras, publier un livre reste soumis à de fortes conventions sociales ; le roman paraît d’abord anonymement.",
  "40": "Il faut respecter la différence de contexte et de destin entre les deux héroïnes."
};
const MODULES={con:["🧭","Connaître","Personnages, intrigue, structure, contexte."],app:["🔎","S'approprier","Passages, interprétations et nuances."],dia:["💬","Dialoguer","Questions d'examinateur et réponses argumentées."],choix:["✦","Mon choix d'œuvre","Trouver tes raisons personnelles de présenter Ourika."]};
const app=document.getElementById("app");
let module=null,pos=0,selected=[],validated=false,optionOrders={};
function shuffledOrder(n){const a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orderForQuestion(index,n){return optionOrders[index]||(optionOrders[index]=shuffledOrder(n))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function home(){module=null;window.scrollTo(0,0);render()}
function start(m){module=m;pos=0;selected=[];validated=false;optionOrders={};window.scrollTo(0,0);render()}
function items(){return DATA.map((d,i)=>({d,i})).filter(x=>x.d[0]===module)}
function pick(i){if(validated)return;selected=[i];render()}
function correct(){return selected[0]===items()[pos].d[5]}
function validate(){if(!selected.length||validated)return;validated=true;render()}
function next(){if(pos+1>=items().length){pos=items().length;render();return}pos++;selected=[];validated=false;render()}
function render(){
if(!module){
app.innerHTML='<section class="hero"><div class="eyebrow">Lecture cursive · Préparation à l’entretien de l&#39;oral du bac français</div><h2>Connaître, s’approprier, dialoguer</h2><p>Les activités t’aideront à mieux connaître le roman, à choisir des exemples précis et à préparer une lecture personnelle.</p><div class="principle">Une interprétation n’est pas une réponse à apprendre. Plusieurs lectures peuvent être défendues si elles respectent le texte et sont argumentées.</div></section><section class="modules">'+Object.entries(MODULES).map(([k,m])=>'<button class="module" data-module="'+k+'"><span class="sym">'+m[0]+'</span><strong>'+esc(m[1])+'</strong><span>'+esc(m[2])+'</span></button>').join('')+'</section>';
app.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>start(b.dataset.module));return}
const its=items();if(pos>=its.length){app.innerHTML='<section class="result"><div class="eyebrow">Activité terminée</div><h2>'+esc(MODULES[module][1])+'</h2><p>Tu as terminé les questions de cette activité. Tu peux revoir les passages cités dans les corrections, puis reprendre les questions librement.</p><button class="button" id="return">Retour aux activités</button></section>';document.getElementById("return").onclick=home;return}
const d=its[pos].d, ok=validated?correct():null, interpr=module!=="con", contexte=CONTEXTE[its[pos].i+1], displayOrder=orderForQuestion(its[pos].i,d[4].length);const ref=d[7], nuance=d[8]||"Cette réponse est une piste possible mais pas une formulation obligatoire. D'autres lectures argumentées peuvent être recevables.";
app.innerHTML='<div class="top"><button class="backbtn" id="return">← Activités</button><span class="small">'+esc(MODULES[module][1])+' · '+(pos+1)+' / '+its.length+'</span></div><section class="question">'+(module==="dia"?'<div class="challenge"><strong>Mode défi</strong>Avant de regarder les propositions, imagine ce que tu pourrais répondre. Les choix servent ensuite à comparer des stratégies d’argumentation.</div>':'')+'<h2>'+esc(d[3])+'</h2><div class="choices">'+displayOrder.map(i=>'<button data-choice="'+i+'" class="'+(validated&&i===d[5]?'good':validated&&selected[0]===i?'wrong':selected[0]===i?'picked':'')+'" '+(validated?'disabled':'')+'>'+esc(d[4][i])+'</button>').join('')+'</div>'+(validated?'<div class="feedback"><strong>'+(ok?'✓ Bonne réponse':'À reprendre')+'</strong>'+esc(d[6])+(interpr?'<div class="nuance">'+esc(nuance)+'</div>':'')+(contexte?'<div class="nuance"><strong>Repère de contexte historique</strong><div>'+esc(contexte)+'</div></div>':'')+'<div class="ref">Repère textuel : '+esc(ref)+'</div></div>':'')+'<div class="action"><button class="button" id="action" '+(!validated&&!selected.length?'disabled':'')+'>'+(validated?(pos+1===its.length?'Terminer l’activité':'Question suivante →'):'Valider ma réponse')+'</button></div></section>';
document.getElementById("return").onclick=home;
app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>pick(Number(b.dataset.choice)));
document.getElementById("action").onclick=validated?next:validate;
}
render();
</script></body></html>
